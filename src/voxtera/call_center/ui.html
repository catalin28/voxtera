<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxtera Call Center — RAG Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1419; color: #e7e9ea; padding: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #1d9bf0; }
        h2 { font-size: 1.1rem; margin: 16px 0 8px; color: #8899a6; border-bottom: 1px solid #2f3336; padding-bottom: 4px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
        .card { background: #1c2128; border: 1px solid #2f3336; border-radius: 8px; padding: 16px; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .status-ok { background: #00ba7c; }
        .status-err { background: #f4212e; }
        button { background: #1d9bf0; color: white; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 0.85rem; margin: 4px 4px 4px 0; }
        button:hover { background: #1a8cd8; }
        button:disabled { background: #555; cursor: not-allowed; }
        button.danger { background: #f4212e; }
        input[type="text"] { background: #2f3336; border: 1px solid #444; color: #e7e9ea; border-radius: 6px; padding: 8px 12px; width: 100%; margin: 4px 0; font-size: 0.9rem; }
        select { background: #2f3336; border: 1px solid #444; color: #e7e9ea; border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; }
        .result-box { background: #0d1117; border: 1px solid #2f3336; border-radius: 6px; padding: 12px; margin-top: 8px; max-height: 400px; overflow-y: auto; font-size: 0.82rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .result-item { border-bottom: 1px solid #2f3336; padding: 8px 0; }
        .result-item:last-child { border-bottom: none; }
        .score { color: #00ba7c; font-weight: bold; }
        .category { color: #ffd700; font-size: 0.75rem; text-transform: uppercase; }
        .hotel-name { color: #1d9bf0; font-weight: 500; }
        .text-preview { color: #8899a6; margin-top: 4px; }
        .loader { display: none; color: #8899a6; font-style: italic; }
        .loader.active { display: block; }
        .badge { display: inline-block; background: #2f3336; border-radius: 4px; padding: 2px 6px; font-size: 0.72rem; margin: 2px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏨 Voxtera Call Center — RAG Admin</h1>
    <p style="color:#8899a6; font-size:0.85rem;">Manage Elasticsearch (hotel resolver) & Qdrant (semantic knowledge base)</p>

    <!-- Status -->
    <div class="card" style="margin-top:12px;">
        <h2>System Status</h2>
        <div id="status">Checking...</div>
        <button onclick="checkStatus()">Refresh Status</button>
    </div>

    <div class="grid">
        <!-- Elasticsearch Panel -->
        <div class="card">
            <h2>Elasticsearch — Hotel Resolver</h2>
            <button onclick="esLoad()">📥 Load Seed Data</button>
            <button onclick="esListHotels()">📋 List Hotels</button>
            <div style="margin-top:8px;">
                <input type="text" id="es-search-q" placeholder="Search hotels (e.g. Rixos, Belek, golf...)" onkeydown="if(event.key==='Enter')esSearch()">
                <button onclick="esSearch()">🔍 Search</button>
            </div>
            <div class="loader" id="es-loader">Loading...</div>
            <div class="result-box" id="es-results"></div>
        </div>

        <!-- Qdrant Panel -->
        <div class="card">
            <h2>Qdrant — Semantic Knowledge Base</h2>
            <button onclick="qdrantLoad()">📥 Embed & Load Chunks</button>
            <button onclick="qdrantCollections()">📋 Collections</button>
            <div style="margin-top:8px;">
                <select id="qdrant-hotel-filter">
                    <option value="">All hotels</option>
                </select>
                <button onclick="qdrantBrowse()">👁 Browse Points</button>
            </div>
            <div style="margin-top:8px;">
                <input type="text" id="qdrant-query" placeholder="Semantic search (e.g. havuzlar ne zaman açık, spa hizmetleri...)" onkeydown="if(event.key==='Enter')qdrantSearch()">
                <button onclick="qdrantSearch()">🔍 Semantic Search</button>
            </div>
            <div class="loader" id="qdrant-loader">Loading...</div>
            <div class="result-box" id="qdrant-results"></div>
        </div>
    </div>
</div>

<script>
const API = '/call_center/api';

async function fetchJSON(url, opts = {}) {
    const resp = await fetch(url, opts);
    return resp.json();
}

async function checkStatus() {
    const el = document.getElementById('status');
    el.textContent = 'Checking...';
    try {
        const s = await fetchJSON(`${API}/status`);
        let html = '';
        html += `<span class="status-dot ${s.es === 'ok' ? 'status-ok' : 'status-err'}"></span>Elasticsearch: ${s.es === 'ok' ? `v${s.es_version}` : s.es_error || 'error'}<br>`;
        html += `<span class="status-dot ${s.qdrant === 'ok' ? 'status-ok' : 'status-err'}"></span>Qdrant: ${s.qdrant === 'ok' ? `${s.qdrant_collections} collections` : s.qdrant_error || 'error'}`;
        el.innerHTML = html;
    } catch (e) {
        el.textContent = 'Failed to reach server: ' + e.message;
    }
}

// --- ES ---
function showEsLoader(on) { document.getElementById('es-loader').classList.toggle('active', on); }

async function esLoad() {
    showEsLoader(true);
    const r = await fetchJSON(`${API}/es/load`, { method: 'POST' });
    showEsLoader(false);
    document.getElementById('es-results').textContent = JSON.stringify(r, null, 2);
    populateHotelFilter();
}

async function esListHotels() {
    showEsLoader(true);
    const r = await fetchJSON(`${API}/es/hotels`);
    showEsLoader(false);
    let html = `<strong>${r.count} hotels</strong>\n\n`;
    for (const h of r.hotels || []) {
        html += `<div class="result-item"><span class="hotel-name">${h.name}</span> <span class="badge">${h.district}</span> <span class="badge">${h.price_tier}</span> <span class="badge">${h.board_type}</span></div>`;
    }
    document.getElementById('es-results').innerHTML = html;
    populateHotelFilter(r.hotels);
}

async function esSearch() {
    const q = document.getElementById('es-search-q').value.trim();
    if (!q) return;
    showEsLoader(true);
    const r = await fetchJSON(`${API}/es/search?q=${encodeURIComponent(q)}`);
    showEsLoader(false);
    let html = `<strong>${r.count} results for "${r.query}"</strong>\n\n`;
    for (const h of r.results || []) {
        html += `<div class="result-item"><span class="score">${h.score.toFixed(2)}</span> <span class="hotel-name">${h.name}</span> (${h.hotel_id})</div>`;
    }
    document.getElementById('es-results').innerHTML = html;
}

// --- Qdrant ---
function showQdrantLoader(on) { document.getElementById('qdrant-loader').classList.toggle('active', on); }

async function qdrantLoad() {
    if (!confirm('This will embed all chunks (may take 1-2 min on CPU). Continue?')) return;
    showQdrantLoader(true);
    document.getElementById('qdrant-results').textContent = 'Embedding chunks... this may take a minute.';
    const r = await fetchJSON(`${API}/qdrant/load`, { method: 'POST' });
    showQdrantLoader(false);
    document.getElementById('qdrant-results').textContent = JSON.stringify(r, null, 2);
}

async function qdrantCollections() {
    showQdrantLoader(true);
    const r = await fetchJSON(`${API}/qdrant/collections`);
    showQdrantLoader(false);
    document.getElementById('qdrant-results').textContent = JSON.stringify(r, null, 2);
}

async function qdrantBrowse() {
    const hotelId = document.getElementById('qdrant-hotel-filter').value;
    showQdrantLoader(true);
    let url = `${API}/qdrant/points?limit=30`;
    if (hotelId) url += `&hotel_id=${encodeURIComponent(hotelId)}`;
    const r = await fetchJSON(url);
    showQdrantLoader(false);
    let html = `<strong>${r.count} points in "${r.collection}"</strong>\n\n`;
    for (const p of r.points || []) {
        const pl = p.payload || {};
        html += `<div class="result-item">`;
        html += `<span class="hotel-name">${pl.hotel_name || '?'}</span> <span class="category">${pl.category || ''}</span>\n`;
        html += `<div class="text-preview">${(pl.text_en || pl.text || '').substring(0, 150)}...</div>`;
        html += `</div>`;
    }
    document.getElementById('qdrant-results').innerHTML = html;
}

async function qdrantSearch() {
    const query = document.getElementById('qdrant-query').value.trim();
    if (!query) return;
    const hotelId = document.getElementById('qdrant-hotel-filter').value;
    showQdrantLoader(true);
    const r = await fetchJSON(`${API}/qdrant/search`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, hotel_id: hotelId, limit: 8 }),
    });
    showQdrantLoader(false);
    let html = `<strong>${r.count} results</strong> (embed: ${r.embed_ms}ms)\n\n`;
    for (const h of r.results || []) {
        html += `<div class="result-item">`;
        html += `<span class="score">${h.score.toFixed(4)}</span> <span class="hotel-name">${h.hotel_name}</span> <span class="category">${h.category}</span>\n`;
        html += `<div class="text-preview">${(h.text_en || h.text || '').substring(0, 200)}...</div>`;
        html += `</div>`;
    }
    document.getElementById('qdrant-results').innerHTML = html;
}

function populateHotelFilter(hotels) {
    const sel = document.getElementById('qdrant-hotel-filter');
    if (hotels) {
        sel.innerHTML = '<option value="">All hotels</option>';
        for (const h of hotels) {
            sel.innerHTML += `<option value="${h.hotel_id}">${h.name}</option>`;
        }
    }
}

// Init
checkStatus();
// Try to load hotel list for filter
fetchJSON(`${API}/es/hotels`).then(r => {
    if (r.hotels) populateHotelFilter(r.hotels);
}).catch(() => {});
</script>
</body>
</html>
