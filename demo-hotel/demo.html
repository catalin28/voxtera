<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Hôtel Lumière — Virtual Concierge</title>
<style>
  body { font-family: system-ui; background: #0f0f1a; color: #e8e8f0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1a1a2e; border-bottom: 1px solid #a08030; padding: 16px; display: flex; gap: 16px; }
  header .logo { font-size: 28px; color: #c9a84c; }
  #status-bar { background: #25253d; padding: 8px 16px; display: flex; gap: 8px; border-bottom: 1px solid #333; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; animation: pulse 1s infinite; }
  #status-dot.listening { background: #4caf50; animation: none; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  #transcript { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; }
  .bubble.user { align-self: flex-end; background: #2a3a5c; }
  .bubble.bot { align-self: flex-start; background: #2a2a40; }
  #welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #controls { background: #1a1a2e; border-top: 1px solid #333; padding: 16px; display: flex; gap: 12px; justify-content: center; }
  button { border: none; border-radius: 8px; padding: 12px 24px; font-weight: 600; cursor: pointer; }
  #btn-start { background: #c9a84c; color: #111; }
  #btn-end { background: #ef5350; color: white; display: none; }
  #btn-mute { background: #333; color: #e8e8f0; display: none; }
  #lang-picker { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; }
  #lang-picker label { font-size: 14px; color: #aaa; }
  #lang-select { background: #1a1a2e; color: #e8e8f0; border: 1px solid #c9a84c; border-radius: 6px; padding: 8px 12px; font-size: 15px; min-width: 220px; cursor: pointer; }
  #lang-select option { background: #1a1a2e; }
  #error-box { background: #3a1a1a; color: #ff8787; padding: 12px; margin: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; display: none; max-height: 150px; overflow-y: auto; }
  #error-box.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="logo">★</div>
  <div><h1 style="font-size:20px; margin:0">Grand Hôtel <span style="color:#c9a84c">Lumière</span></h1></div>
</header>

<div id="error-box"></div>

<div id="status-bar" style="display:none">
  <div id="status-dot"></div>
  <span id="status-text"></span>
</div>

<div id="welcome">
  <div style="font-size:60px">🎙️</div>
  <h2 style="color:#c9a84c">Welcome to Voxtera</h2>
  <p>Click Start to begin speaking with your virtual concierge</p>
  <div id="lang-picker">
    <label for="lang-select">🌐 Choose your language</label>
    <select id="lang-select">
      <option value="multi">Auto-detect (EN/ES/FR/DE/HI/RU/PT/JA/IT/NL)</option>
      <option value="en">English</option>
      <option value="fr">French / Français</option>
      <option value="es">Spanish / Español</option>
      <option value="de">German / Deutsch</option>
      <option value="it">Italian / Italiano</option>
      <option value="pt">Portuguese / Português</option>
      <option value="ro">Romanian / Română</option>
      <option value="tr">Turkish / Türkçe</option>
      <option value="nl">Dutch / Nederlands</option>
      <option value="ja">Japanese / 日本語</option>
      <option value="hi">Hindi / हिन्दी</option>
      <option value="ru">Russian / Русский</option>
      <option value="ar">Arabic / العربية</option>
      <option value="zh">Chinese / 中文</option>
      <option value="ko">Korean / 한국어</option>
      <option value="pl">Polish / Polski</option>
      <option value="bg">Bulgarian / Български</option>
      <option value="cs">Czech / Čeština</option>
      <option value="da">Danish / Dansk</option>
      <option value="el">Greek / Ελληνικά</option>
      <option value="fi">Finnish / Suomi</option>
      <option value="he">Hebrew / עברית</option>
      <option value="hu">Hungarian / Magyar</option>
      <option value="id">Indonesian / Bahasa</option>
      <option value="no">Norwegian / Norsk</option>
      <option value="sv">Swedish / Svenska</option>
      <option value="th">Thai / ไทย</option>
      <option value="uk">Ukrainian / Українська</option>
      <option value="vi">Vietnamese / Tiếng Việt</option>
    </select>
  </div>
</div>

<div id="transcript" style="display:none"></div>

<div id="controls">
  <button id="btn-start">🎙️ Start</button>
  <button id="btn-mute">🔇 Mute</button>
  <button id="btn-end">End</button>
</div>

<script src="https://unpkg.com/@daily-co/daily-js"></script>
<script>
var ROOM_URL = 'https://voxtera.daily.co/voxtera-demo';
var callObject = null;
var isMuted = false;

function log(msg) { console.log('[voxtera] ' + msg); }
function err(msg) {
  var box = document.getElementById('error-box');
  box.textContent += msg + '\n';
  box.classList.add('show');
  console.error(msg);
}

log('Checking Daily SDK...');
if (!window.DailyIframe) err('Daily SDK failed to load');
else log('Daily SDK loaded');

document.getElementById('btn-start').onclick = function() {
  log('START clicked');
  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Connecting...';

  if (!window.DailyIframe) {
    err('Daily SDK not available');
    btn.disabled = false;
    btn.textContent = '🎙️ Start';
    return;
  }

  try {
    // --- Audio output via Web Audio API (more reliable than <audio> element) ---
    var audioCtx = null;
    var activeSource = null;
    var attachedTrackId = null;

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        log('AudioContext created (sampleRate=' + audioCtx.sampleRate + ')');
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(function() { log('AudioContext resumed'); });
      }
      return audioCtx;
    }

    // Create AudioContext on user gesture (Start click) to satisfy autoplay policy.
    ensureAudioContext();

    function attachRemoteAudio(track, source) {
      if (!track || !track.enabled || track.readyState !== 'live') {
        log('Skipping track from ' + source + ' (enabled=' + (track && track.enabled) + ', readyState=' + (track && track.readyState) + ')');
        return;
      }
      if (attachedTrackId === track.id) {
        log('Track already attached (id=' + track.id + ')');
        return;
      }
      // Disconnect previous source.
      if (activeSource) {
        try { activeSource.disconnect(); } catch(e) {}
        activeSource = null;
      }
      var ctx = ensureAudioContext();
      var stream = new MediaStream([track]);
      activeSource = ctx.createMediaStreamSource(stream);
      activeSource.connect(ctx.destination);
      attachedTrackId = track.id;
      log('Attached audio via WebAudio from ' + source + ' (id=' + track.id + ', enabled=' + track.enabled + ', readyState=' + track.readyState + ')');
    }

    // Explicitly request mic permission BEFORE creating call object so the
    // browser permission prompt is tied to the user click gesture.
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(function(stream) {
        log('Microphone permission granted');
        // Stop the temp stream; Daily will request its own.
        stream.getTracks().forEach(function(t) { t.stop(); });
      })
      .catch(function(e) {
        err('Microphone permission denied: ' + e.message);
      });

    callObject = window.DailyIframe.createCallObject({
      audioSource: true,
      videoSource: false,
    });
    log('Call object created');

    function scanParticipantsForAudio() {
      try {
        var participants = callObject.participants();
        for (var key in participants) {
          var p = participants[key];
          if (p.local) continue;
          var t = p.tracks && p.tracks.audio;
          if (t && t.state === 'playable' && t.persistentTrack) {
            attachRemoteAudio(t.persistentTrack, 'scan.persistent');
            return true;
          }
          if (t && t.state === 'playable' && t.track) {
            attachRemoteAudio(t.track, 'scan.track');
            return true;
          }
        }
      } catch (e) {
        err('scanParticipants error: ' + e.message);
      }
      return false;
    }

    // Poll for audio track — covers the race where the bot's track isn't
    // playable yet when we first scan on joined-meeting.
    var _audioAttachRetries = 0;
    function pollForAudioTrack() {
      if (attachedTrackId) return; // already attached
      if (_audioAttachRetries >= 20) {
        err('Gave up polling for audio track after 20 attempts');
        return;
      }
      _audioAttachRetries++;
      if (!scanParticipantsForAudio()) {
        setTimeout(pollForAudioTrack, 500);
      }
    }

    callObject.on('app-message', function(evt) {
      if (!evt.data || evt.data.type !== 'voxtera-event') return;
      var msg = evt.data;
      log('EVENT: ' + msg.event);

      if (msg.event === 'bot-reply') {
        addBubble('bot', msg.data.text);
      } else if (msg.event === 'user-transcript') {
        addBubble('user', msg.data.text);
      } else if (msg.event === 'bot-speaking') {
        setStatus('speaking', '🔊 Speaking...');
        ensureAudioContext();
        // Last-chance attach if not connected yet.
        if (!attachedTrackId) scanParticipantsForAudio();
      } else if (msg.event === 'bot-done-speaking') {
        setStatus('listening', '🟢 Listening...');
      }
    });

    callObject.on('participant-joined', function(evt) {
      log('participant-joined: ' + (evt.participant && evt.participant.user_name));
    });

    callObject.on('participant-updated', function(evt) {
      var p = evt.participant;
      if (!p || p.local) return;
      var t = p.tracks && p.tracks.audio;
      if (t && t.state === 'playable') {
        var track = t.persistentTrack || t.track;
        if (track) attachRemoteAudio(track, 'participant-updated');
      }
    });

    callObject.on('track-started', function(evt) {
      if (!evt.track || evt.track.kind !== 'audio') return;
      if (evt.participant && evt.participant.local) return;
      attachRemoteAudio(evt.track, 'track-started');
    });

    callObject.on('joined-meeting', function() {
      log('Joined meeting');
      if (!scanParticipantsForAudio()) {
        pollForAudioTrack();
      }
    });

    callObject.on('error', function(e) {
      err('Daily error: ' + (e.errorMsg || 'unknown'));
    });

    callObject.on('left-meeting', resetUI);

    log('Joining: ' + ROOM_URL);
    callObject.join({ url: ROOM_URL, userName: 'Guest' }).then(function() {
      log('Joined successfully');
      // Send selected language to the bot via app-message.
      var lang = document.getElementById('lang-select').value;
      log('Sending language preference: ' + lang);
      callObject.sendAppMessage({ type: 'voxtera-language', language: lang }, '*');
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('transcript').style.display = 'flex';
      document.getElementById('status-bar').style.display = 'flex';
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-end').style.display = 'inline-block';
      document.getElementById('btn-mute').style.display = 'inline-block';
      setStatus('listening', '🟢 Listening...');
    }).catch(function(e) {
      err('Join failed: ' + e.message);
      btn.disabled = false;
      btn.textContent = '🎙️ Start';
    });

  } catch (e) {
    err('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = '🎙️ Start';
  }
};

document.getElementById('btn-end').onclick = function() {
  if (activeSource) { try { activeSource.disconnect(); } catch(e) {} activeSource = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  attachedTrackId = null;
  if (callObject) {
    callObject.leave().then(function() {
      callObject.destroy();
      resetUI();
    }).catch(resetUI);
  } else {
    resetUI();
  }
};

document.getElementById('btn-mute').onclick = function() {
  if (!callObject) return;
  isMuted = !isMuted;
  callObject.setLocalAudio(!isMuted);
  this.textContent = isMuted ? '🔈 Unmute' : '🔇 Mute';
};

function setStatus(state, text) {
  document.getElementById('status-dot').className = state;
  document.getElementById('status-text').textContent = text;
}

function addBubble(role, text) {
  var div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  document.getElementById('transcript').appendChild(div);
  document.getElementById('transcript').scrollTop = 999999;
}

function resetUI() {
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('transcript').style.display = 'none';
  document.getElementById('status-bar').style.display = 'none';
  document.getElementById('btn-start').style.display = 'inline-block';
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-start').textContent = '🎙️ Start';
  document.getElementById('btn-end').style.display = 'none';
  document.getElementById('btn-mute').style.display = 'none';
}

log('Ready');
</script>
</body>
</html>
