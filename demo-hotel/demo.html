<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Hôtel Lumière — Virtual Concierge</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: system-ui; background: #0f0f1a; color: #e8e8f0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1a1a2e; border-bottom: 1px solid #a08030; padding: 16px; display: flex; gap: 16px; }
  header .logo { font-size: 28px; color: #c9a84c; }
  #status-bar { background: #25253d; padding: 8px 16px; display: flex; gap: 8px; border-bottom: 1px solid #333; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; animation: pulse 1s infinite; }
  #status-dot.listening { background: #4caf50; animation: none; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  #transcript { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; }
  .bubble.user { align-self: flex-end; background: #2a3a5c; }
  .bubble.bot { align-self: flex-start; background: #2a2a40; }
  #welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #controls { background: #1a1a2e; border-top: 1px solid #333; padding: 16px; display: flex; gap: 12px; justify-content: center; }
  button { border: none; border-radius: 8px; padding: 12px 24px; font-weight: 600; cursor: pointer; }
  #btn-start { background: #c9a84c; color: #111; }
  #btn-end { background: #ef5350; color: white; display: none; }
  #btn-mute { background: #333; color: #e8e8f0; display: none; }
  #lang-picker { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; }
  #lang-picker label { font-size: 14px; color: #aaa; }
  #lang-select { background: #1a1a2e; color: #e8e8f0; border: 1px solid #c9a84c; border-radius: 6px; padding: 8px 12px; font-size: 15px; min-width: 220px; cursor: pointer; }
  #lang-select option { background: #1a1a2e; }
  .model-pickers { display: flex; gap: 24px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .model-picker { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .model-picker label { font-size: 14px; color: #aaa; }
  .model-picker select { background: #1a1a2e; color: #e8e8f0; border: 1px solid #555; border-radius: 6px; padding: 8px 12px; font-size: 14px; min-width: 180px; cursor: pointer; }
  .model-picker select option { background: #1a1a2e; }
  .mode-picker { margin-top: 10px; display: flex; justify-content: center; }
  .mode-picker label { display: inline-flex; align-items: center; gap: 8px; color: #d7d7de; font-size: 14px; }
  .mode-picker input { width: 16px; height: 16px; accent-color: #c9a84c; }
  #error-box { background: #3a1a1a; color: #ff8787; padding: 12px; margin: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; display: none; max-height: 150px; overflow-y: auto; }
  #error-box.show { display: block; }

  /* --- Orb visualizer --- */
  #orb-container { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px 0 8px; }
  #orb-canvas { width: 180px; height: 180px; }
  #orb-label { font-size: 13px; color: #888; margin-top: 8px; letter-spacing: 0.5px; transition: color 0.3s; }
  #orb-label.speaking { color: #c9a84c; }
  #orb-label.listening { color: #4caf50; }

  /* --- Reconnect overlay --- */
  #reconnect-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,15,26,0.92); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
  #reconnect-overlay.show { display: flex; }
  #reconnect-overlay h2 { color: #e0e0e0; font-size: 22px; margin-bottom: 12px; }
  #reconnect-overlay p { color: #999; font-size: 14px; margin-bottom: 24px; }
  #btn-reconnect { background: #c9a84c; color: #1a1a2e; border: none; padding: 12px 32px; border-radius: 24px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  #btn-reconnect:hover { background: #e0c060; }

  /* --- Audio test buttons --- */
  .audio-tests { display: flex; gap: 24px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .audio-test { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .audio-test button { background: #2a2a40; color: #e8e8f0; border: 1px solid #555; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  .audio-test button:hover { border-color: #c9a84c; background: #33334d; }
  .audio-test button:disabled { opacity: 0.5; cursor: not-allowed; }
  .audio-test button.active { border-color: #4caf50; background: #1e3a1e; }

  .sound-indicator { display: flex; align-items: center; gap: 6px; height: 20px; min-width: 120px; justify-content: center; }
  .sound-indicator .label { font-size: 12px; color: #888; }
  .sound-indicator .bars { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
  .sound-indicator .bar { width: 4px; background: #555; border-radius: 2px; transition: height 0.08s, background 0.08s; min-height: 3px; }
  .sound-indicator .bar.active { background: #4caf50; }
  .sound-indicator .bar.hot { background: #ff9800; }
  .sound-indicator.idle .bar { height: 3px; background: #555; }
</style>
</head>
<body>

<header>
  <div class="logo">★</div>
  <div><h1 style="font-size:20px; margin:0">Grand Hôtel <span style="color:#c9a84c">Lumière</span></h1></div>
</header>

<div id="error-box"></div>

<div id="reconnect-overlay">

  <span id="status-text"></span>
</div>

<div id="welcome">
  <div style="font-size:60px">🎙️</div>
  <h2 style="color:#c9a84c">Welcome to Voxtera</h2>
  <p>Click Start to begin speaking with your virtual concierge</p>
  <div id="lang-picker">
    <label for="lang-select">🌐 Choose your language</label>
    <select id="lang-select">
      <option value="multi">Auto-detect (EN/ES/FR)</option>
      <option value="en">English</option>
      <option value="fr">French / Français</option>
      <option value="es">Spanish / Español</option>
      <option value="de">German / Deutsch</option>
      <option value="it">Italian / Italiano</option>

      <option value="ro">Romanian / Română</option>
      <option value="tr">Turkish / Türkçe</option>
      <option value="nl">Dutch / Nederlands</option>
      <option value="ja">Japanese / 日本語</option>
      <option value="hi">Hindi / हिन्दी</option>
      <option value="ru">Russian / Русский</option>
      <option value="ar">Arabic / العربية</option>
      <option value="zh">Chinese / 中文</option>
      <option value="ko">Korean / 한국어</option>
      <option value="pl">Polish / Polski</option>
      <option value="bg">Bulgarian / Български</option>
      <option value="cs">Czech / Čeština</option>
      <option value="da">Danish / Dansk</option>
      <option value="el">Greek / Ελληνικά</option>
      <option value="fi">Finnish / Suomi</option>
      <option value="he">Hebrew / עברית</option>
      <option value="hu">Hungarian / Magyar</option>
      <option value="id">Indonesian / Bahasa</option>
      <option value="no">Norwegian / Norsk</option>
      <option value="sv">Swedish / Svenska</option>
      <option value="th">Thai / ไทย</option>
      <option value="uk">Ukrainian / Українська</option>
      <option value="vi">Vietnamese / Tiếng Việt</option>
    </select>
  </div>
  <div class="model-pickers">
    <div class="model-picker">
      <label for="stt-select">🎤 STT model</label>
      <select id="stt-select">
        <!-- Google (latest_long) is the default — broadly available.
             Google Chirp 2 is lower latency (~250ms) but requires
             us-central1 region. Pick it manually to test. -->
        <option value="whisper">Whisper (OpenAI)</option>
        <option value="deepgram">Deepgram Nova-3</option>
        <option value="google" selected>Google (latest_long)</option>
        <option value="google-chirp2">Google Chirp 2 (low-latency)</option>
      </select>
    </div>
    <div class="model-picker">
      <label for="llm-select">🤖 LLM model</label>
      <select id="llm-select">
        <option value="claude-haiku-4-5-20251001" selected>Claude Haiku 4.5 (fast)</option>
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (quality)</option>
        <option value="claude-opus-4-7">Claude Opus 4.7 (best)</option>
      </select>
    </div>
    <div class="model-picker">
      <label for="tts-provider-select">🔊 TTS provider</label>
      <select id="tts-provider-select">
        <!-- OpenAI tts-1 is the default because it works on the standard
             <audio>-element WebRTC path in every browser including Safari.
             Google Chirp 3 HD has lower TTS warmup (~400ms vs ~1000ms) and
             multilingual voice consistency, but its 24kHz output broke
             Safari's MediaStreamAudioSourceNode rendering in our 2026-05-05
             test. Pick Chirp 3 HD manually when testing latency. -->
        <option value="openai" selected>OpenAI tts-1</option>
        <option value="google">Google Chirp 3 HD</option>

    </div>
    <div class="model-picker">

      <select id="voice-select">
        <!-- Populated by setVoiceOptions(provider) on TTS-provider change.
             Static defaults below match the page-load TTS provider above
             (OpenAI tts-1). When the user picks Google Chirp 3 HD from the
             provider combobox, this list is replaced with Chirp 3 HD voices. -->
        <option value="nova" selected>Nova</option>
        <option value="alloy">Alloy</option>
        <option value="echo">Echo</option>
        <option value="fable">Fable</option>
        <option value="onyx">Onyx</option>
        <option value="shimmer">Shimmer</option>
        <option value="ash">Ash</option>
        <option value="coral">Coral</option>

      </select>
    </div>
    <div class="model-picker">
      <label for="mic-select">🎤 Microphone</label>
      <select id="mic-select">
        <!-- Populated by populateMicDevices() after the user grants mic
             permission for the first time (labels are empty without
             permission). Until then, only "System default" is available.
             We default to the first NON-VIRTUAL device so users with
             BlackHole/Aggregate/Teams virtual devices don't get silence. -->
        <option value="">System default</option>
      </select>
    </div>
  </div>

  <div class="mode-picker">
    <label for="use-chat">
      <input id="use-chat" type="checkbox">
      Use chat (type questions, hear voice answers)
    </label>
  </div>

  <div class="audio-tests">
    <div class="audio-test">
      <button id="btn-test-speaker" type="button">🔊 Test Speaker</button>
      <div class="sound-indicator idle" id="speaker-indicator">
        <div class="bars" id="speaker-bars">
          <div class="bar" style="height:3px"></div>
          <div class="bar" style="height:3px"></div>
          <div class="bar" style="height:3px"></div>
          <div class="bar" style="height:3px"></div>
          <div class="bar" style="height:3px"></div>
        </div>
        <span class="label" id="speaker-label">Idle</span>
      </div>
    </div>
    <div class="audio-test">
      <button id="btn-test-mic" type="button">🎤 Test Microphone</button>
      <div class="sound-indicator idle" id="mic-indicator">
        <div class="bars" id="mic-bars">
          <div class="bar" style="height:3px"></div>
          <div class="bar" style="height:3px"></div>
          <div class="bar" style="height:3px"></div>
          <div class="bar" style="height:3px"></div>
          <div class="bar" style="height:3px"></div>
        </div>
        <span class="label" id="mic-label">Idle</span>
      </div>
    </div>
  </div>
</div>

<div id="orb-container">
  <canvas id="orb-canvas" width="360" height="360"></canvas>
  <div id="orb-label">Idle</div>
</div>

<div id="transcript" style="display:none"></div>

<div id="controls">
  <button id="btn-start">🎙️ Start</button>
  <button id="btn-mute">🔇 Mute</button>
  <button id="btn-end">End</button>
</div>

<audio id="remote-audio" autoplay playsinline style="display:none"></audio>

<script src="https://unpkg.com/@daily-co/daily-js"></script>
<script>
// Default fallback used only if the launcher response somehow omits room_url.
// In normal operation /api/start-session returns the URL the bot just joined.
var ROOM_URL = 'https://voxtera.daily.co/voxtera-demo';
// Session ID assigned by the launcher when this Start click spawned a bot.
// Kept around for diagnostics; the bot also tracks it via VOXTERA_SESSION_ID.
var SESSION_ID = null;
var callObject = null;
var isMuted = false;
var userEndedSession = false;
var remoteAudioEl = document.getElementById('remote-audio');
var audioCtx = null;
var activeSource = null;
var attachedTrackId = null;
var attachedTrack = null;
    // Audio path selection.
    //
    // Default: the standard <audio> element path for ALL browsers. Verified
    // working in Brave (always) and Safari 26.1 on macOS (after
    // 2026-05-05 testing with ?audio=element). The historical reason for
    // routing Safari through WebAudio was a "tiny WebRTC jitter buffer"
    // that made <audio> playback choppy on older Safari versions, but
    // modern Safari handles it cleanly while the WebAudio path
    // (MediaStreamAudioSourceNode + muted-primer trick) actively breaks in
    // 26.x — attach reports success, ctx.state=running, but no PCM samples
    // reach the speakers.
    //
    // The variable is still named `isSafari` because three other branches
    // in this file (bot-speaking handler, orb analyser setup, etc.) gate
    // WebAudio-only code on it. They all do the right thing when it's
    // false: follow the <audio> element path, which is what we want.
    //
    // URL override (debug / regression triage):
    //   ?audio=webaudio — opt back in to the legacy WebAudio path. Use if
    //                     a future Safari version regresses on the <audio>
    //                     element path.
    //   ?audio=element  — kept as a no-op for backward compatibility with
    //                     existing diagnostic URLs; the <audio> path is
    //                     now the default anyway.
var isSafari = false;
var _audioPathOverride = (function() {
  try {
    var v = (new URLSearchParams(window.location.search)).get('audio');
    return v ? v.toLowerCase() : '';
  } catch (e) { return ''; }
})();
if (_audioPathOverride === 'webaudio') {
  isSafari = true; // opt back in to legacy WebAudio path
}
function log(msg) { console.log('[voxtera] ' + msg); }
function err(msg) {
  var box = document.getElementById('error-box');
  box.textContent += msg + '\n';
  box.classList.add('show');
  console.error(msg);
}

 log('UA: ' + navigator.userAgent.substring(0, 120));
 log('isSafari=' + isSafari + ' — audio path: ' + (isSafari ? 'WebAudio (ctx.destination)' : '<audio> element')
   + (_audioPathOverride ? ' (overridden via ?audio=' + _audioPathOverride + ')' : ''));
 log('Checking Daily SDK...');
if (!window.DailyIframe) err('Daily SDK failed to load');
else log('Daily SDK loaded');

document.getElementById('btn-start').onclick = async function() {
  log('START clicked');
  var btn = this;
  btn.disabled = true;
  btn.textContent = '⏳ Starting bot...';

  // Safari autoplay-policy guard.
  //
  // Safari consumes the user-activation token across the first ``await`` in
  // an async handler. If we create the AudioContext after ``await fetch
  // /api/start-session`` returns ~5-7 s later, the context is created
  // outside the user-gesture window — Safari accepts it (state=running) but
  // won't route audio to the speakers. The legacy synchronous flow worked
  // because click → join → audio happened in one tick.
  //
  // The fix: create AND resume the AudioContext BEFORE any await. The
  // resulting context carries the user-gesture token through the full flow,
  // so when ``ensureAudioContext()`` is called again later it's a no-op and
  // the WebAudio path can play the bot's voice.
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      log('AudioContext created early (sampleRate=' + audioCtx.sampleRate + ')');
    } catch (audioErr) {
      err('AudioContext creation failed: ' + audioErr.message);
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    // Fire-and-forget — resume() returns a Promise but we deliberately do
    // NOT await it here; awaiting before any other work would defeat the
    // whole point of running this synchronously inside the gesture.
    audioCtx.resume().then(function() {
      log('AudioContext resumed early (state=' + audioCtx.state + ')');
    }).catch(function(e) {
      err('AudioContext resume failed: ' + e.message);
    });
  }

  if (document.getElementById('use-chat').checked) {
    var params = new URLSearchParams({
      language: document.getElementById('lang-select').value,
      llm: document.getElementById('llm-select').value,
      stt: document.getElementById('stt-select').value,
      ttsProvider: document.getElementById('tts-provider-select').value,
      voice: document.getElementById('voice-select').value
    });
    window.location.href = 'chat.html?' + params.toString();
    return;
  }

  if (!window.DailyIframe) {
    err('Daily SDK not available');
    btn.disabled = false;
    btn.textContent = '🎙️ Start';
    return;
  }

  // Phase 4 — On-demand bot spawn handshake.
  //
  // Before joining Daily, ask the launcher to spawn a fresh bot subprocess.
  // The launcher blocks until the bot is in the room (via the launcher_client
  // queue handshake) and only then returns the room URL. This guarantees the
  // bot is already a Daily participant when we call ``callObject.join`` —
  // no race, no missed greeting, no idle bot squatting in the room between
  // calls. See docs/ON_DEMAND_BOT_SPAWN.md for the full flow.
  try {
    log('[launcher] requesting bot spawn...');
    var startResp = await fetch('/api/start-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        language: document.getElementById('lang-select').value,
        llm: document.getElementById('llm-select').value,
        stt: document.getElementById('stt-select').value,
        ttsProvider: document.getElementById('tts-provider-select').value,
        voice: document.getElementById('voice-select').value
      })
    });
    if (startResp.status === 409) {
      var busyData = await startResp.json().catch(function() { return {}; });
      err('Demo is busy — another session is active. Try again in a minute.');
      log('[launcher] 409 busy, active_session=' + (busyData.active_session || '?'));
      btn.disabled = false;
      btn.textContent = '🎙️ Start';
      return;
    }
    if (!startResp.ok) {
      var errData = await startResp.json().catch(function() { return {}; });
      err('Failed to start bot (HTTP ' + startResp.status + '): ' + (errData.error || 'unknown error'));
      btn.disabled = false;
      btn.textContent = '🎙️ Start';
      return;
    }
    var startData = await startResp.json();
    if (startData.room_url) ROOM_URL = startData.room_url;
    SESSION_ID = startData.session_id || null;
    log('[launcher] bot ready, session=' + SESSION_ID + ' room=' + ROOM_URL);
    btn.textContent = '⏳ Joining session...';
  } catch (fetchErr) {
    err('Could not reach launcher at /api/start-session: ' + fetchErr.message);
    btn.disabled = false;
    btn.textContent = '🎙️ Start';
    return;
  }

  try {
    if (!window.isSecureContext) {
      err('Microphone access requires a secure origin. Open this page via HTTPS or from http://localhost.');
      btn.disabled = false;
      btn.textContent = '🎙️ Start';
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      err('This browser does not expose mediaDevices.getUserMedia. Try Chrome/Edge/Safari on HTTPS or localhost.');
      btn.disabled = false;
      btn.textContent = '🎙️ Start';
      return;
    }

    // --- Audio output via Web Audio API (more reliable than <audio> element) ---

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        log('AudioContext created (sampleRate=' + audioCtx.sampleRate + ')');
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(function() { log('AudioContext resumed'); });
      }
      return audioCtx;
    }

    // Create AudioContext on user gesture (Start click) to satisfy autoplay policy.
    ensureAudioContext();

    function attachRemoteAudio(track, source) {
      if (!track || !track.enabled || track.readyState !== 'live') {
        log('Skipping track from ' + source + ' (enabled=' + (track && track.enabled) + ', readyState=' + (track && track.readyState) + ')');
        return;
      }
      if (attachedTrackId === track.id) {
        log('Track already attached (id=' + track.id + ') — skipping duplicate attach from ' + source);
        return;
      }
      // Daily fires several overlapping events (participant-updated,
      // track-started, scan from joined-meeting/bot-speaking) and the
      // persistent-track reference can have a different .id than the
      // track-started event's track. If we re-attach while the previous
      // track is still live, Safari keeps the old WebAudio sink running
      // and you hear the bot voice twice with a delay. Only allow a new
      // attach if the previously-attached track has actually ended.
      if (attachedTrack && attachedTrack.readyState === 'live') {
        log('Active track still live (id=' + attachedTrack.id + ') — ignoring new attach for ' + track.id + ' from ' + source);
        return;
      }
      // Disconnect previous WebAudio source if any
      if (activeSource) {
        try { activeSource.disconnect(); } catch(e) {}
        activeSource = null;
      }
      // Drop the previous orb analyser too — we'll rebuild it for the new source
      if (orbBotSource) { try { orbBotSource.disconnect(); } catch(e) {} orbBotSource = null; }
      orbAnalyserBot = null;
      var stream = new MediaStream([track]);

      if (isSafari) {
        // Safari's <audio> element has a tiny jitter buffer for WebRTC
        // MediaStreams causing choppy playback. Route through WebAudio API
        // which applies its own smoothing buffer.
        log('[safari] using WebAudio path for track ' + track.id + ' from ' + source);
        try {
          var ctx = ensureAudioContext();
          activeSource = ctx.createMediaStreamSource(stream);
          activeSource.connect(ctx.destination);
          attachedTrackId = track.id;
          attachedTrack = track;
          log('[safari] WebAudio attached OK (ctx.state=' + ctx.state + ')');
          // WebKit "primer" workaround: Safari's MediaStreamAudioSourceNode
          // silently produces zeros for a WebRTC track unless the SAME
          // stream is also bound to an HTMLMediaElement. The element is
          // kept MUTED so we don't get double playback — it's only there
          // to wake up Safari's audio pipeline so the WebAudio graph
          // actually receives samples.
          //
          // Symptoms when omitted: ctx.state=running, no errors, bot text
          // arrives, transcript flows, but speakers stay silent. We hit
          // this in Safari 26.1 with the on-demand spawn flow on
          // 2026-05-05 — clearing srcObject was the original fix for a
          // *different* "double playback" bug; muting the element solves
          // both.
          remoteAudioEl.muted = true;
          remoteAudioEl.srcObject = stream;
          remoteAudioEl.play().catch(function(playErr) {
            // Muted autoplay should always succeed under autoplay policy;
            // log if it doesn't so we can see why on a future regression.
            log('[safari] muted primer play() rejected: ' + playErr.message);
          });
          if (!orbAnalyserBot) orbSetupBotAnalyserFromSource(activeSource);
        } catch (e) {
          err('[safari] WebAudio attach failed: ' + e.message + ' — falling back to <audio>');
          // Fall through to <audio> element path
          activeSource = null;
          remoteAudioEl.srcObject = stream;
          remoteAudioEl.muted = false;
          remoteAudioEl.volume = 1.0;
          remoteAudioEl.play().catch(function(e2) { err('Fallback play failed: ' + e2.message); });
          attachedTrackId = track.id;
          attachedTrack = track;
        }
      } else {
        // Chrome/Brave/Edge: <audio> element works perfectly
        try {
          remoteAudioEl.srcObject = stream;
          remoteAudioEl.muted = false;
          remoteAudioEl.volume = 1.0;
          remoteAudioEl.play().then(function() {
            attachedTrackId = track.id;
            attachedTrack = track;
            log('Attached audio via <audio> element from ' + source + ' (id=' + track.id + ')');
            if (!orbAnalyserBot) orbSetupBotAnalyser();
          }).catch(function(e) {
            err('Audio element play blocked: ' + e.message);
          });
        } catch (e) {
          err('Audio element attach failed: ' + e.message);
        }
      }
    }

    // Pass the picker's deviceId straight to Daily so the bot receives
    // audio from the user's actual mic, not whatever Chrome decides is
    // the system default (often BlackHole or another virtual device on
    // macOS). When the value is empty (System default), passing `true`
    // preserves the previous "let Daily choose" behaviour.
    var startMicDeviceId = document.getElementById('mic-select').value;
    var dailyAudioSource = startMicDeviceId || true;
    if (startMicDeviceId) {
      log('[start] using picked mic deviceId=' + startMicDeviceId.substring(0, 8) + '...');
    } else {
      log('[start] using system-default mic (no device picked)');
    }
    callObject = window.DailyIframe.createCallObject({
      audioSource: dailyAudioSource,
      videoSource: false,
    });
    log('Call object created');

    // Identify the bot in a Daily participant entry. Daily's JS SDK exposes
    // the display name as either ``user_name`` (snake) or ``userName`` (camel)
    // depending on version and code path; we accept both. We also fall back
    // to "any non-local participant" because in the on-demand spawn model
    // there is only ever the one bot in the room.
    function isBotParticipant(p) {
      if (!p || p.local) return false;
      var name = p.user_name || p.userName || '';
      // Strict match if the name is set, otherwise accept any remote.
      return name === 'Voxtera' || name === '';
    }

    function scanParticipantsForAudio() {
      try {
        var participants = callObject.participants();
        // Diagnostic: log every participant we see, so we can tell whether
        // the bot is even visible to the JS client when polling fails.
        var seen = [];
        for (var k in participants) {
          var pp = participants[k];
          seen.push({
            key: k,
            local: !!pp.local,
            user_name: pp.user_name,
            userName: pp.userName,
            audio_state: pp.tracks && pp.tracks.audio && pp.tracks.audio.state,
            has_persistent: !!(pp.tracks && pp.tracks.audio && pp.tracks.audio.persistentTrack),
            has_track: !!(pp.tracks && pp.tracks.audio && pp.tracks.audio.track),
          });
        }
        log('[scan] participants=' + JSON.stringify(seen));

        for (var key in participants) {
          var p = participants[key];
          if (!isBotParticipant(p)) continue;
          var t = p.tracks && p.tracks.audio;
          if (t && t.state === 'playable' && t.persistentTrack) {
            attachRemoteAudio(t.persistentTrack, 'scan.persistent');
            return true;
          }
          if (t && t.state === 'playable' && t.track) {
            attachRemoteAudio(t.track, 'scan.track');
            return true;
          }
        }
      } catch (e) {
        err('scanParticipants error: ' + e.message);
      }
      return false;
    }

    // Poll for audio track — covers the race where the bot's track isn't
    // playable yet when we first scan on joined-meeting.
    var _audioAttachRetries = 0;
    function pollForAudioTrack() {
      if (attachedTrackId) return; // already attached
      if (_audioAttachRetries >= 20) {
        err('Gave up polling for audio track after 20 attempts');
        return;
      }
      _audioAttachRetries++;
      if (!scanParticipantsForAudio()) {
        setTimeout(pollForAudioTrack, 500);
      }
    }

    callObject.on('app-message', function(evt) {
      if (!evt.data || evt.data.type !== 'voxtera-event') return;
      var msg = evt.data;
      log('EVENT: ' + msg.event);

      if (msg.event === 'bot-reply') {
        addBubble('bot', msg.data.text);
      } else if (msg.event === 'user-transcript') {
        addBubble('user', msg.data.text);
      } else if (msg.event === 'bot-speaking') {
        setStatus('speaking', '🔊 Speaking...');
        orbSetState('speaking');
        ensureAudioContext();
        if (!isSafari) {
          // Brave/Chrome: nudge <audio> element playback
          remoteAudioEl.play().catch(function(e) {});
        } else {
          // Safari: WebAudio path handles playback; just resume ctx if needed
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }
        if (!attachedTrackId) {
          log('[audio] bot-speaking but no track attached yet — scanning');
          scanParticipantsForAudio();
        }
        if (!orbAnalyserBot) {
          if (isSafari && activeSource) {
            orbSetupBotAnalyserFromSource(activeSource);
          } else if (remoteAudioEl.srcObject) {
            orbSetupBotAnalyser();
          }
        }
      } else if (msg.event === 'bot-done-speaking') {
        setStatus('listening', '🟢 Listening...');
        orbSetState('listening');
      }
    });

    callObject.on('participant-joined', function(evt) {
      var p = evt.participant;
      log('participant-joined: user_name=' + (p && p.user_name) +
          ' userName=' + (p && p.userName) +
          ' local=' + (p && p.local));
    });

    callObject.on('participant-left', function(evt) {
      var p = evt.participant;
      if (!isBotParticipant(p)) return;
      log('Bot left the room — showing reconnect overlay');
      showReconnectOverlay();
    });

    callObject.on('participant-updated', function(evt) {
      var p = evt.participant;
      if (!isBotParticipant(p)) return;
      var t = p.tracks && p.tracks.audio;
      if (t && t.state === 'playable') {
        var track = t.persistentTrack || t.track;
        if (track) attachRemoteAudio(track, 'participant-updated');
      }
    });

    callObject.on('track-started', function(evt) {
      if (!evt.track || evt.track.kind !== 'audio') return;
      if (!isBotParticipant(evt.participant)) return;
      attachRemoteAudio(evt.track, 'track-started');
    });

    callObject.on('joined-meeting', function() {
      log('Joined meeting');
      if (!scanParticipantsForAudio()) {
        pollForAudioTrack();
      }
    });

    callObject.on('error', function(e) {
      err('Daily error: ' + (e.errorMsg || 'unknown'));
      showReconnectOverlay();
    });

    callObject.on('left-meeting', function() {
      if (userEndedSession) {
        resetUI();
      } else {
        resetUI();
        showReconnectOverlay();
      }
    });

    log('Joining: ' + ROOM_URL);
    callObject.join({ url: ROOM_URL, userName: 'Guest' }).then(function() {
      log('Joined successfully');
      // Send selected language, LLM model and TTS voice to the bot.
      var lang = document.getElementById('lang-select').value;
      var llmModel = document.getElementById('llm-select').value;
      var ttsProvider = document.getElementById('tts-provider-select').value;
      var ttsVoice = document.getElementById('voice-select').value;
      var sttProvider = document.getElementById('stt-select').value;
      log('STT: ' + sttProvider + ' | LLM: ' + llmModel + ' | TTS: ' + ttsProvider + '/' + ttsVoice);
      callObject.sendAppMessage({ type: 'voxtera-stt', provider: sttProvider }, '*');
      log('Sending language preference: ' + lang);
      callObject.sendAppMessage({ type: 'voxtera-language', language: lang }, '*');
      callObject.sendAppMessage({ type: 'voxtera-model', model: llmModel }, '*');
      callObject.sendAppMessage({ type: 'voxtera-tts-provider', provider: ttsProvider }, '*');
      callObject.sendAppMessage({ type: 'voxtera-voice', voice: ttsVoice }, '*');
      callObject.sendAppMessage({ type: 'voxtera-ready' }, '*');
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('transcript').style.display = 'flex';
      document.getElementById('status-bar').style.display = 'flex';
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-end').style.display = 'inline-block';
      document.getElementById('btn-mute').style.display = 'inline-block';
      setStatus('listening', '🟢 Listening...');
      orbStart();
      orbSetState('listening');
      // Setup mic analyser for orb from the local mic track
      try {
        var localParticipant = callObject.participants().local;
        var localAudioTrack = localParticipant && localParticipant.tracks && localParticipant.tracks.audio;
        if (localAudioTrack && localAudioTrack.persistentTrack) {
          orbSetupMicAnalyser(new MediaStream([localAudioTrack.persistentTrack]));
        }
      } catch(e) { log('Orb mic setup deferred: ' + e.message); }
    }).catch(function(e) {
      err('Join failed: ' + e.message);
      btn.disabled = false;
      btn.textContent = '🎙️ Start';
    });

  } catch (e) {
    err('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = '🎙️ Start';
  }
};

document.getElementById('btn-end').onclick = function() {
  userEndedSession = true;
  if (activeSource) { try { activeSource.disconnect(); } catch(e) {} activeSource = null; }
  if (remoteAudioEl) {
    remoteAudioEl.pause();
    remoteAudioEl.srcObject = null;
  }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  attachedTrackId = null;
  attachedTrack = null;
  if (callObject) {
    callObject.leave().then(function() {
      callObject.destroy();
      callObject = null;
      resetUI();
    }).catch(function() {
      callObject = null;
      resetUI();
    });
  } else {
    resetUI();
  }
};

document.getElementById('btn-mute').onclick = function() {
  if (!callObject) return;
  isMuted = !isMuted;
  callObject.setLocalAudio(!isMuted);
  this.textContent = isMuted ? '🔈 Unmute' : '🔇 Mute';
};

function setStatus(state, text) {
  document.getElementById('status-dot').className = state;
  document.getElementById('status-text').textContent = text;
}

function addBubble(role, text) {
  var div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  document.getElementById('transcript').appendChild(div);
  document.getElementById('transcript').scrollTop = 999999;
}

function clearConversationView() {
  var transcript = document.getElementById('transcript');
  transcript.innerHTML = '';
  transcript.scrollTop = 0;
}

function resetUI() {
  orbStop();
  userEndedSession = false;
  clearConversationView();
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('transcript').style.display = 'none';
  document.getElementById('status-bar').style.display = 'none';
  document.getElementById('btn-start').style.display = 'inline-block';
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-start').textContent = '🎙️ Start';
  document.getElementById('btn-end').style.display = 'none';
  document.getElementById('btn-mute').style.display = 'none';
  document.getElementById('btn-mute').textContent = '🔇 Mute';
  isMuted = false;
}

document.getElementById('lang-select').addEventListener('change', function() {

// Language picker is always visible — it provides a hint even for Whisper.

// TTS provider <-> voice list coupling. The voice IDs are provider-specific
// (OpenAI uses short names like "nova"; Google Chirp 3 HD uses IDs like

    ['en-US-Chirp3-HD-Puck', 'Puck (en-US)'],

  ]
};
function setVoiceOptions(provider) {

// Mic picker — if a call is active, hot-swap the input device on Daily so
// the user can switch from headset to laptop mic (or away from a virtual
// device they accidentally selected) without dropping the call. Daily
// exposes setInputDevicesAsync exactly for this; passing the deviceId
// makes Daily re-acquire the track and republish.
document.getElementById('mic-select').addEventListener('change', function() {
  var deviceId = this.value;
  if (callObject && deviceId) {
    log('Hot-swapping mic to deviceId=' + deviceId.substring(0, 8) + '...');
    callObject.setInputDevicesAsync({ audioDeviceId: deviceId }).then(function() {
      log('Mic hot-swap OK');
    }).catch(function(e) {
      err('Mic hot-swap failed: ' + e.message);
    });
  }
});

// ========== Audio Test: Speaker ==========
var speakerTestActive = false;
var speakerAnimFrame = null;
var speakerAudio = null;

function setSpeakerBars(levels) {
  var bars = document.getElementById('speaker-bars').children;
  for (var i = 0; i < bars.length; i++) {
    var h = Math.max(3, (levels[i] || 0) * 18);
    bars[i].style.height = h + 'px';
    bars[i].className = 'bar' + (levels[i] > 0.2 ? (levels[i] > 0.7 ? ' hot' : ' active') : '');
  }
}

function resetSpeakerIndicator() {
  speakerTestActive = false;
  if (speakerAnimFrame) { cancelAnimationFrame(speakerAnimFrame); speakerAnimFrame = null; }
  if (speakerAudio) { speakerAudio.pause(); speakerAudio = null; }
  document.getElementById('speaker-indicator').className = 'sound-indicator idle';
  document.getElementById('speaker-label').textContent = 'Idle';
  setSpeakerBars([0, 0, 0, 0, 0]);
  var btn = document.getElementById('btn-test-speaker');
  btn.classList.remove('active');
  btn.disabled = false;
  btn.textContent = '🔊 Test Speaker';
}

function animateSpeakerBars() {
  if (!speakerTestActive) return;
  var levels = [];
  for (var i = 0; i < 5; i++) levels.push(0.3 + Math.random() * 0.7);
  setSpeakerBars(levels);
  speakerAnimFrame = requestAnimationFrame(function() {
    setTimeout(function() { animateSpeakerBars(); }, 80);
  });
}

document.getElementById('btn-test-speaker').onclick = function() {
  if (speakerTestActive) {
    resetSpeakerIndicator();
    return;
  }
  var btn = this;
  btn.disabled = true;
  btn.classList.add('active');
  btn.textContent = '⏳ Loading...';
  speakerTestActive = true;
  document.getElementById('speaker-indicator').className = 'sound-indicator';
  document.getElementById('speaker-label').textContent = 'Generating...';

  var provider = document.getElementById('tts-provider-select').value;
  var voice = document.getElementById('voice-select').value;
  var lang = document.getElementById('lang-select').value;
  var model = document.getElementById('llm-select').value;

  fetch('/api/tts-test', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ provider: provider, voice: voice, language: lang, model: model })
  })
  .then(function(resp) {
    if (!resp.ok) return resp.json().then(function(e) { throw new Error(e.error || 'TTS failed'); });
    return resp.blob();
  })
  .then(function(blob) {
    if (!speakerTestActive) return;
    var url = URL.createObjectURL(blob);
    speakerAudio = new Audio(url);
    speakerAudio.onplay = function() {
      btn.textContent = '⏹ Stop';
      btn.disabled = false;
      document.getElementById('speaker-label').textContent = 'Playing...';
      animateSpeakerBars();
    };
    speakerAudio.onended = function() {
      URL.revokeObjectURL(url);
      resetSpeakerIndicator();
    };
    speakerAudio.onerror = function() {
      URL.revokeObjectURL(url);
      err('Audio playback failed');
      resetSpeakerIndicator();
    };
    speakerAudio.play().catch(function(e) {
      err('Playback blocked: ' + e.message);
      resetSpeakerIndicator();
    });
  })
  .catch(function(e) {
    err('TTS test failed: ' + e.message);
    resetSpeakerIndicator();
  });
};

// ========== Audio Test: Microphone ==========
var micTestActive = false;
var micStream = null;
var micAnalyser = null;
var micAnimFrame = null;
var micAudioCtx = null;

function setMicBars(levels) {
  var bars = document.getElementById('mic-bars').children;
  for (var i = 0; i < bars.length; i++) {
    var h = Math.max(3, (levels[i] || 0) * 18);
    bars[i].style.height = h + 'px';
    bars[i].className = 'bar' + (levels[i] > 0.2 ? (levels[i] > 0.7 ? ' hot' : ' active') : '');
  }
}

function resetMicIndicator() {
  micTestActive = false;
  if (micAnimFrame) { cancelAnimationFrame(micAnimFrame); micAnimFrame = null; }
  if (micStream) { micStream.getTracks().forEach(function(t) { t.stop(); }); micStream = null; }
  if (micAudioCtx) { micAudioCtx.close(); micAudioCtx = null; }
  micAnalyser = null;
  document.getElementById('mic-indicator').className = 'sound-indicator idle';
  document.getElementById('mic-label').textContent = 'Idle';
  setMicBars([0, 0, 0, 0, 0]);
  var btn = document.getElementById('btn-test-mic');
  btn.classList.remove('active');
  btn.disabled = false;
  btn.textContent = '🎤 Test Microphone';
}

function animateMicBars() {
  if (!micTestActive || !micAnalyser) return;
  var data = new Uint8Array(micAnalyser.frequencyBinCount);
  micAnalyser.getByteFrequencyData(data);
  // Sample 5 bands across the frequency spectrum
  var step = Math.floor(data.length / 5);
  var levels = [];
  for (var i = 0; i < 5; i++) {
    var sum = 0;
    for (var j = 0; j < step; j++) sum += data[i * step + j];
    levels.push((sum / step) / 255);
  }
  setMicBars(levels);

  var maxLevel = Math.max.apply(null, levels);
  document.getElementById('mic-label').textContent = maxLevel > 0.05 ? 'Receiving...' : 'Listening...';

  micAnimFrame = requestAnimationFrame(animateMicBars);
}

// Names that mark a device as "virtual" on macOS — these usually produce
// silence unless something is explicitly routing audio into them. We push
// them to the bottom of the picker and never auto-select them as default.
var VIRTUAL_MIC_PATTERNS = /blackhole|aggregate|virtual|teams audio|loopback|soundflower/i;

function isVirtualMic(label) {
  return VIRTUAL_MIC_PATTERNS.test(label || '');
}

// Populate the mic picker from enumerateDevices(). Labels are only exposed
// after the user has granted mic permission at least once in this origin —
// before that, the dropdown stays at just "System default".
function populateMicDevices() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  return navigator.mediaDevices.enumerateDevices().then(function(devices) {
    var sel = document.getElementById('mic-select');
    var prevValue = sel.value;
    var inputs = devices.filter(function(d) { return d.kind === 'audioinput'; });
    if (inputs.length === 0 || !inputs[0].label) {
      // No labels yet — permission not granted. Leave default option only.
      log('[mic-devices] enumerate returned ' + inputs.length + ' inputs without labels');
      return;
    }
    // Sort: real devices first, virtual devices at the bottom.
    inputs.sort(function(a, b) {
      var av = isVirtualMic(a.label) ? 1 : 0;
      var bv = isVirtualMic(b.label) ? 1 : 0;
      return av - bv;
    });
    sel.innerHTML = '';
    inputs.forEach(function(d) {
      var opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label + (isVirtualMic(d.label) ? ' ⚠ virtual' : '');
      sel.appendChild(opt);
    });
    // Default to first non-virtual device on initial population. If user
    // already picked something earlier in the session, keep their choice.
    if (prevValue && Array.prototype.some.call(sel.options, function(o) { return o.value === prevValue; })) {
      sel.value = prevValue;
    }
    log('[mic-devices] populated with ' + inputs.length + ' devices, default="' + sel.options[0].textContent + '"');
  }).catch(function(e) {
    log('[mic-devices] enumerate failed: ' + e.message);
  });
}

// Try once on load — labels will be empty unless permission was granted in
// a prior session. Either way, populateMicDevices() runs again after the
// first successful getUserMedia (Test Mic or Start), at which point the
// labels appear and the picker fills in.
populateMicDevices();
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', populateMicDevices);
}

document.getElementById('btn-test-mic').onclick = function() {
  log('[mic-test] click');
  if (micTestActive) {
    resetMicIndicator();
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    err('Microphone access not available. Try Chrome/Edge/Safari on HTTPS or localhost.');
    return;
  }
  var btn = this;
  btn.disabled = true;

  // Build constraints. If the user has explicitly picked a device in the
  // mic picker, force exactly that deviceId — otherwise Chrome may hand us
  // back the system default (often BlackHole or another virtual device on
  // macOS) regardless of what's selected in the per-site permission panel.
  var pickedDeviceId = document.getElementById('mic-select').value;
  var audioConstraints;
  if (pickedDeviceId) {
    audioConstraints = { deviceId: { exact: pickedDeviceId } };
    log('[mic-test] requesting deviceId=' + pickedDeviceId.substring(0, 8) + '...');
  } else {
    audioConstraints = true;
    log('[mic-test] requesting system default mic');
  }

  navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false }).then(function(stream) {
    log('[mic-test] getUserMedia resolved');
    // Now that permission is granted, device labels are exposed —
    // re-populate the picker so the user can switch to a different mic
    // for the next test without leaving the page.
    populateMicDevices();
    micStream = stream;
    micTestActive = true;
    btn.classList.add('active');
    btn.disabled = false;
    btn.textContent = '⏹ Stop';
    document.getElementById('mic-indicator').className = 'sound-indicator';
    document.getElementById('mic-label').textContent = 'Listening...';

    // Diagnostic: dump every audio track returned by Chrome so we can see
    // which device was actually selected and what its settings are.
    var tracks = stream.getAudioTracks();
    log('[mic-test] track count=' + tracks.length);
    tracks.forEach(function(t, i) {
      var settings = (typeof t.getSettings === 'function') ? t.getSettings() : {};
      log('[mic-test] track[' + i + '] label="' + t.label + '" enabled=' + t.enabled +
          ' muted=' + t.muted + ' readyState=' + t.readyState +
          ' sampleRate=' + settings.sampleRate +
          ' deviceId=' + (settings.deviceId || '').substring(0, 8) +
          ' channelCount=' + settings.channelCount);
    });

    micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    log('[mic-test] AudioContext created state=' + micAudioCtx.state +
        ' sampleRate=' + micAudioCtx.sampleRate);

    // Chrome's autoplay policy: an AudioContext created after an async
    // boundary (here, the awaited getUserMedia permission prompt) starts
    // in 'suspended' state because the click's user-gesture token has
    // already been consumed. While suspended, the AnalyserNode produces
    // all-zero samples — getByteFrequencyData returns zeros and the VU
    // bars never move. Safari was unaffected (its gesture token survives
    // the prompt), which is why this only repros in Chrome/Brave/Edge.
    // Resuming explicitly is allowed because we're still inside the
    // user-initiated permission flow.
    if (micAudioCtx.state === 'suspended') {
      micAudioCtx.resume().then(function() {
        log('[mic-test] AudioContext resumed (state=' + micAudioCtx.state + ')');
      }).catch(function(resumeErr) {
        err('[mic-test] AudioContext resume failed: ' + resumeErr.message);
      });
    }
    var source = micAudioCtx.createMediaStreamSource(stream);
    micAnalyser = micAudioCtx.createAnalyser();
    micAnalyser.fftSize = 256;
    source.connect(micAnalyser);

    // Diagnostic: every ~1s, log peak frequency data so we can tell whether
    // the analyser is receiving samples or always returns zero.
    var diagCount = 0;
    var diagInterval = setInterval(function() {
      if (!micTestActive || !micAnalyser) { clearInterval(diagInterval); return; }
      var data = new Uint8Array(micAnalyser.frequencyBinCount);
      micAnalyser.getByteFrequencyData(data);
      var peak = 0, sum = 0;
      for (var i = 0; i < data.length; i++) { if (data[i] > peak) peak = data[i]; sum += data[i]; }
      log('[mic-test] tick #' + (++diagCount) + ' peak=' + peak +
          ' avg=' + (sum / data.length).toFixed(1) +
          ' ctx.state=' + micAudioCtx.state +
          ' track.muted=' + (tracks[0] && tracks[0].muted) +
          ' track.readyState=' + (tracks[0] && tracks[0].readyState));
      if (diagCount >= 5) clearInterval(diagInterval); // stop after 5 ticks
    }, 1000);

    animateMicBars();
  }).catch(function(e) {
    err('Microphone permission denied: ' + e.message);
    btn.disabled = false;
  });
};

log('Ready');

// ========== Reconnect Overlay ==========
function showReconnectOverlay() {
  document.getElementById('reconnect-overlay').classList.add('show');
}

function hideReconnectOverlay() {
  document.getElementById('reconnect-overlay').classList.remove('show');
}

document.getElementById('btn-reconnect').onclick = function() {
  hideReconnectOverlay();
  // Trigger a fresh start by clicking the Start button
  document.getElementById('btn-start').click();
};

// ========== Orb Visualizer ==========
var orbCanvas = document.getElementById('orb-canvas');
var orbCtx = orbCanvas.getContext('2d');
var orbState = 'idle'; // 'idle' | 'listening' | 'speaking'
var orbAmplitude = 0;
var orbTargetAmplitude = 0;
var orbAnalyserBot = null;
var orbAnalyserMic = null;
var orbAnimRunning = false;
var orbMicSource = null;
var orbBotSource = null;

// Color palette
var ORB_COLORS = {
  idle:      { core: [30, 30, 60],    glow: [100, 100, 160], ring: [60, 60, 100] },
  listening: { core: [20, 180, 120],  glow: [40, 220, 150],  ring: [30, 200, 130] },
  speaking:  { core: [201, 168, 76],  glow: [230, 190, 80],  ring: [180, 150, 60] }
};

function lerpColor(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
}

var orbCurrentColors = ORB_COLORS.idle;
var orbPrevTime = 0;

function orbSetState(state) {
  orbState = state;
  var label = document.getElementById('orb-label');
  label.textContent = state === 'speaking' ? 'Speaking...' : state === 'listening' ? 'Listening...' : 'Idle';
  label.className = state;
}

function getOrbAmplitudeFromAnalyser(analyser) {
  if (!analyser) return 0;
  var data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);
  var sum = 0;
  for (var i = 0; i < data.length; i++) {
    var v = (data[i] - 128) / 128;
    sum += v * v;
  }
  return Math.sqrt(sum / data.length);
}

function drawOrb(timestamp) {
  if (!orbAnimRunning) return;
  requestAnimationFrame(drawOrb);

  var dt = timestamp - orbPrevTime;
  if (dt < 16) return; // cap at ~60fps
  orbPrevTime = timestamp;

  // Get amplitude from the correct source
  var rawAmp = 0;
  if (orbState === 'speaking' && orbAnalyserBot) {
    rawAmp = getOrbAmplitudeFromAnalyser(orbAnalyserBot);
  } else if (orbState === 'listening' && orbAnalyserMic) {
    rawAmp = getOrbAmplitudeFromAnalyser(orbAnalyserMic);
  }

  // Smooth amplitude (ease toward target)
  orbTargetAmplitude = Math.min(1, rawAmp * 4);
  orbAmplitude += (orbTargetAmplitude - orbAmplitude) * 0.15;

  var colors = ORB_COLORS[orbState] || ORB_COLORS.idle;
  var w = orbCanvas.width;
  var h = orbCanvas.height;
  var cx = w / 2;
  var cy = h / 2;
  var baseRadius = 50;
  var pulseRadius = baseRadius + orbAmplitude * 25;

  orbCtx.clearRect(0, 0, w, h);

  // Outer glow rings (concentric, fading out)
  var rings = 4;
  for (var i = rings; i >= 1; i--) {
    var ringR = pulseRadius + i * 12 + Math.sin(timestamp * 0.002 + i) * 3 * orbAmplitude;
    var alpha = (0.08 + orbAmplitude * 0.12) * (1 - i / (rings + 1));
    orbCtx.beginPath();
    orbCtx.arc(cx, cy, ringR, 0, Math.PI * 2);
    orbCtx.strokeStyle = 'rgba(' + Math.round(colors.ring[0]) + ',' + Math.round(colors.ring[1]) + ',' + Math.round(colors.ring[2]) + ',' + alpha.toFixed(3) + ')';
    orbCtx.lineWidth = 2 + orbAmplitude * 2;
    orbCtx.stroke();
  }

  // Main glow (radial gradient)
  var glowRadius = pulseRadius + 30 + orbAmplitude * 20;
  var grad = orbCtx.createRadialGradient(cx, cy, pulseRadius * 0.3, cx, cy, glowRadius);
  var coreAlpha = 0.6 + orbAmplitude * 0.4;
  grad.addColorStop(0, 'rgba(' + Math.round(colors.core[0]) + ',' + Math.round(colors.core[1]) + ',' + Math.round(colors.core[2]) + ',' + coreAlpha.toFixed(2) + ')');
  grad.addColorStop(0.5, 'rgba(' + Math.round(colors.glow[0]) + ',' + Math.round(colors.glow[1]) + ',' + Math.round(colors.glow[2]) + ',' + (coreAlpha * 0.4).toFixed(2) + ')');
  grad.addColorStop(1, 'rgba(' + Math.round(colors.glow[0]) + ',' + Math.round(colors.glow[1]) + ',' + Math.round(colors.glow[2]) + ',0)');
  orbCtx.beginPath();
  orbCtx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
  orbCtx.fillStyle = grad;
  orbCtx.fill();

  // Core sphere (solid with inner highlight)
  var coreGrad = orbCtx.createRadialGradient(cx - pulseRadius * 0.3, cy - pulseRadius * 0.3, 0, cx, cy, pulseRadius);
  coreGrad.addColorStop(0, 'rgba(255,255,255,0.25)');
  coreGrad.addColorStop(0.4, 'rgba(' + Math.round(colors.core[0]) + ',' + Math.round(colors.core[1]) + ',' + Math.round(colors.core[2]) + ',0.95)');
  coreGrad.addColorStop(1, 'rgba(' + Math.round(colors.core[0] * 0.5) + ',' + Math.round(colors.core[1] * 0.5) + ',' + Math.round(colors.core[2] * 0.5) + ',1)');
  orbCtx.beginPath();
  orbCtx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
  orbCtx.fillStyle = coreGrad;
  orbCtx.fill();

  // Breathing idle animation (subtle scale pulse even with no audio)
  if (orbState === 'idle' || orbAmplitude < 0.01) {
    var breath = 0.5 + 0.5 * Math.sin(timestamp * 0.001);
    orbTargetAmplitude = Math.max(orbTargetAmplitude, breath * 0.08);
  }
}

function orbStart() {
  if (orbAnimRunning) return;
  orbAnimRunning = true;
  document.getElementById('orb-container').style.display = 'flex';
  requestAnimationFrame(drawOrb);
}

function orbStop() {
  orbAnimRunning = false;
  document.getElementById('orb-container').style.display = 'none';
  orbAmplitude = 0;
  orbTargetAmplitude = 0;
  orbState = 'idle';
  if (orbMicSource) { try { orbMicSource.disconnect(); } catch(e) {} orbMicSource = null; }
  if (orbBotSource) { try { orbBotSource.disconnect(); } catch(e) {} orbBotSource = null; }
  orbAnalyserBot = null;
  orbAnalyserMic = null;
}

function orbSetupMicAnalyser(stream) {
  if (!audioCtx) return;
  try {
    orbAnalyserMic = audioCtx.createAnalyser();
    orbAnalyserMic.fftSize = 256;
    orbMicSource = audioCtx.createMediaStreamSource(stream);
    orbMicSource.connect(orbAnalyserMic);
    // Do NOT connect to destination — we don't want to hear ourselves.
  } catch(e) {
    log('Orb mic analyser setup failed: ' + e.message);
  }
}

function orbSetupBotAnalyser() {
  if (!audioCtx || !remoteAudioEl || !remoteAudioEl.srcObject) return;
  try {
    orbAnalyserBot = audioCtx.createAnalyser();
    orbAnalyserBot.fftSize = 256;
    orbBotSource = audioCtx.createMediaStreamSource(remoteAudioEl.srcObject);
    orbBotSource.connect(orbAnalyserBot);
    // Do NOT connect to destination — the <audio> element already plays it.
  } catch(e) {
    log('Orb bot analyser setup failed: ' + e.message);
  }
}

function orbSetupBotAnalyserFromSource(mediaStreamSource) {
  // Safari path: activeSource is already connected to ctx.destination for
  // playback. Branch the analyser off the same node — no extra destination
  // connection needed.
  if (!audioCtx || !mediaStreamSource) return;
  try {
    orbAnalyserBot = audioCtx.createAnalyser();
    orbAnalyserBot.fftSize = 256;
    mediaStreamSource.connect(orbAnalyserBot);
  } catch(e) {
    log('Orb bot analyser (Safari) setup failed: ' + e.message);
  }
}
</script>
</body>
