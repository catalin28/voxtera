<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Try Voxtera — Talk or type, in any language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f4ede1;
    --cream-deep:#ebe1cf;
    --ink:#1a1814;
    --ink-soft:#2c2822;
    --gold:#b8884a;
    --gold-deep:#8a5f2a;
    --gold-light:#d4a563;
    --rust:#a4391c;
    --rust-soft:#c95436;
    --paper:#faf6ec;
    --line:rgba(26,24,20,0.14);
    --line-strong:rgba(26,24,20,0.32);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Fraunces',serif;
    font-weight:400;
    overflow:hidden;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  /* paper grain */
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    z-index:1;
    opacity:.35;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.35 0 0 0 0 0.25 0 0 0 0.08 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode:multiply;
  }
  .mono{font-family:'JetBrains Mono',monospace;letter-spacing:0.02em;}

  /* ============ TOP BAR ============ */
  .topbar{
    position:relative;z-index:10;
    padding:1.2rem 2rem;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(20px) saturate(140%);
    background:rgba(244,237,225,0.72);
  }
  .logo{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.3rem;
    letter-spacing:-0.02em;
    display:flex;align-items:center;gap:0.6rem;
    color:var(--ink);
    text-decoration:none;
  }
  .logo-mark{
    width:26px;height:26px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .logo sup{
    font-size:0.5rem;
    font-family:'JetBrains Mono',monospace;
    color:var(--gold-deep);
    margin-left:0.2rem;
    letter-spacing:0.1em;
  }
  .topbar-right{
    display:flex;align-items:center;gap:1.4rem;
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--ink-soft);
  }
  .topbar-right a{color:var(--ink-soft);text-decoration:none;transition:color .25s;}
  .topbar-right a:hover{color:var(--rust);}
  .session-state{
    display:inline-flex;align-items:center;gap:0.5rem;
  }
  .session-dot{
    width:7px;height:7px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 0 rgba(184,136,74,0.5);
    animation:pulse-dot 2s infinite;
  }
  @keyframes pulse-dot{
    0%{box-shadow:0 0 0 0 rgba(184,136,74,0.5);}
    70%{box-shadow:0 0 0 8px rgba(184,136,74,0);}
    100%{box-shadow:0 0 0 0 rgba(184,136,74,0);}
  }

  /* ============ MAIN STAGE ============ */
  main{
    position:relative;z-index:2;
    flex:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:2rem;
    overflow:hidden;
  }

  /* tagline */
  .stage-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    color:var(--gold-deep);
    letter-spacing:0.2em;
    text-transform:uppercase;
    margin-bottom:0.8rem;
    opacity:0;
    animation:fade-in 1s 0.2s ease forwards;
  }
  .stage-title{
    font-family:'Fraunces',serif;
    font-weight:300;
    font-size:clamp(1.6rem,2.6vw,2.4rem);
    line-height:1.15;
    letter-spacing:-0.02em;
    text-align:center;
    margin-bottom:0;
    max-width:30ch;
    opacity:0;
    animation:fade-in 1s 0.4s ease forwards;
  }
  .stage-title .italic{
    font-family:'Instrument Serif',serif;
    font-style:italic;
    color:var(--rust);
  }
  .stage-sub{
    font-family:'Instrument Serif',serif;
    font-style:italic;
    font-size:1.05rem;
    color:var(--ink-soft);
    margin-top:0.6rem;
    text-align:center;
    opacity:0;
    animation:fade-in 1s 0.5s ease forwards;
  }
  @keyframes fade-in{
    to{opacity:1;}
  }

  /* ============ ORB ============ */
  .orb-wrap{
    position:relative;
    margin:1.5rem 0;
    width:min(360px, 52vw);
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    animation:orb-in 1.4s 0.6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes orb-in{
    from{opacity:0;transform:scale(0.85);}
    to{opacity:1;transform:scale(1);}
  }

  /* outer halo ring */
  .orb-halo{
    position:absolute;inset:-8%;
    border-radius:50%;
    background:
      radial-gradient(circle at center, rgba(184,136,74,0.18) 0%, rgba(184,136,74,0) 70%);
    filter:blur(8px);
    transition:transform 0.4s cubic-bezier(.2,.7,.2,1), opacity 0.4s ease;
    pointer-events:none;
  }

  /* the orb itself */
  .orb{
    position:relative;
    width:100%;height:100%;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 30%, var(--cream) 0%, var(--paper) 20%, transparent 50%),
      conic-gradient(from 180deg at 50% 50%,
        var(--gold-light) 0deg,
        var(--gold) 60deg,
        var(--gold-deep) 120deg,
        var(--rust-soft) 180deg,
        var(--rust) 220deg,
        var(--gold-deep) 280deg,
        var(--gold) 320deg,
        var(--gold-light) 360deg
      );
    box-shadow:
      inset 0 0 80px rgba(255,245,220,0.4),
      inset 0 -20px 60px rgba(164,57,28,0.25),
      0 30px 80px -30px rgba(184,136,74,0.5),
      0 10px 30px -10px rgba(26,24,20,0.25);
    animation:orb-spin 22s linear infinite, orb-breathe 4s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes orb-spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes orb-breathe{
    0%,100%{filter:brightness(1) saturate(1);}
    50%{filter:brightness(1.08) saturate(1.1);}
  }

  /* overlay shimmer (counter-rotates so the highlights move differently from base) */
  .orb-shimmer{
    position:absolute;inset:0;
    border-radius:50%;
    background:
      conic-gradient(from 0deg at 50% 50%,
        transparent 0deg,
        rgba(255,245,220,0.3) 60deg,
        transparent 120deg,
        rgba(212,165,99,0.25) 180deg,
        transparent 240deg,
        rgba(255,245,220,0.35) 300deg,
        transparent 360deg
      );
    mix-blend-mode:overlay;
    animation:orb-counter 16s linear infinite reverse;
    pointer-events:none;
  }
  @keyframes orb-counter{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  /* dynamic state classes — set by JS */
  .orb-wrap.listening .orb-halo{
    background:radial-gradient(circle at center, rgba(58,138,58,0.28) 0%, rgba(58,138,58,0) 65%);
    transform:scale(1.1);
  }
  .orb-wrap.listening .orb{
    animation:orb-spin 22s linear infinite, orb-listen 1.4s ease-in-out infinite;
    box-shadow:
      inset 0 0 80px rgba(255,245,220,0.4),
      inset 0 -20px 60px rgba(58,138,58,0.3),
      0 30px 80px -30px rgba(58,138,58,0.6),
      0 0 0 4px rgba(58,138,58,0.18),
      0 10px 30px -10px rgba(26,24,20,0.25);
  }
  @keyframes orb-listen{
    0%,100%{transform:scale(1) rotate(var(--r,0deg));}
    50%{transform:scale(1.04) rotate(var(--r,0deg));}
  }
  .orb-wrap.speaking .orb-halo{
    background:radial-gradient(circle at center, rgba(164,57,28,0.32) 0%, rgba(164,57,28,0) 65%);
    transform:scale(1.15);
  }
  .orb-wrap.speaking .orb{
    animation:orb-spin 14s linear infinite, orb-speak 0.55s ease-in-out infinite;
    box-shadow:
      inset 0 0 80px rgba(255,245,220,0.5),
      inset 0 -20px 60px rgba(164,57,28,0.4),
      0 30px 80px -30px rgba(164,57,28,0.55),
      0 0 0 5px rgba(164,57,28,0.15),
      0 10px 30px -10px rgba(26,24,20,0.3);
  }
  @keyframes orb-speak{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }

  /* phone button on the orb */
  .orb-call-btn{
    position:absolute;
    bottom:6%;right:6%;
    width:64px;height:64px;
    border-radius:50%;
    background:var(--ink);
    color:var(--cream);
    border:3px solid var(--cream);
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:
      0 12px 30px -10px rgba(26,24,20,0.5),
      0 4px 10px -4px rgba(26,24,20,0.3);
    transition:transform .25s cubic-bezier(.2,.7,.2,1), background .25s, box-shadow .25s;
    z-index:3;
  }
  .orb-call-btn:hover{
    background:var(--rust);
    transform:scale(1.08);
    box-shadow:
      0 16px 40px -10px rgba(164,57,28,0.55),
      0 6px 16px -4px rgba(164,57,28,0.35);
  }
  .orb-call-btn svg{width:24px;height:24px;}
  .orb-call-btn.in-call{
    background:var(--rust);
    animation:call-pulse 1.2s ease-in-out infinite;
  }
  @keyframes call-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(164,57,28,0.55), 0 12px 30px -10px rgba(164,57,28,0.5);}
    70%{box-shadow:0 0 0 14px rgba(164,57,28,0), 0 12px 30px -10px rgba(164,57,28,0.5);}
  }

  /* status caption under the orb */
  .stage-caption{
    margin-top:1.6rem;
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    text-align:center;
    min-height:1.2em;
    transition:color .25s;
    opacity:0;
    animation:fade-in 1s 0.9s ease forwards;
  }
  .stage-caption strong{
    color:var(--rust);
    font-weight:500;
  }

  /* ============ STOP BUTTON ============ */
  #stop-btn{
    display:none;
    margin:1.4rem auto 0;
    background:transparent;
    border:1.5px solid var(--rust);
    color:var(--rust);
    border-radius:2rem;
    padding:0.45rem 1.4rem;
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .2s, color .2s;
    z-index:4;
  }
  #stop-btn:hover{ background:var(--rust); color:var(--cream); }

  /* ============ TRANSCRIPT ============ */
  .transcript{
    position:relative;z-index:2;
    width:min(720px, 100% - 4rem);
    margin:1rem auto 0;
    max-height:32vh;
    overflow-y:auto;
    padding:0 0.4rem;
    scrollbar-width:thin;
    scrollbar-color:var(--line-strong) transparent;
  }
  .transcript::-webkit-scrollbar{width:6px;}
  .transcript::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px;}
  .msg{
    display:flex;flex-direction:column;
    margin-bottom:0.9rem;
    opacity:0;
    transform:translateY(8px);
    animation:msg-in .4s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes msg-in{
    to{opacity:1;transform:translateY(0);}
  }
  .msg .who{
    font-family:'JetBrains Mono',monospace;
    font-size:0.6rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--gold-deep);
    margin-bottom:0.3rem;
  }
  .msg.user .who{color:var(--ink-soft);}
  .msg.bot .who{color:var(--rust);}
  .msg .bubble{
    font-family:'Fraunces',serif;
    font-size:1.02rem;
    line-height:1.45;
    padding:0.75rem 1rem;
    border-radius:14px;
    max-width:80%;
    align-self:flex-start;
  }
  .msg.user .bubble{
    background:var(--cream-deep);
    border:1px solid var(--line);
    align-self:flex-end;
    border-bottom-right-radius:4px;
  }
  .msg.bot .bubble{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--gold);
    border-bottom-left-radius:4px;
  }
  .msg.bot .bubble.typing::after{
    content:"";
    display:inline-block;
    width:6px;height:14px;
    background:var(--gold-deep);
    margin-left:3px;
    vertical-align:-2px;
    animation:caret-blink 0.9s steps(2) infinite;
  }
  @keyframes caret-blink{
    50%{opacity:0;}
  }

  /* ============ INPUT BAR ============ */
  .input-bar-wrap{
    position:relative;z-index:5;
    padding:1.2rem 2rem 1.6rem;
    background:linear-gradient(to bottom, transparent, var(--cream) 30%);
  }
  .input-bar{
    max-width:880px;margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line-strong);
    border-radius:22px;
    padding:0.9rem 1.2rem 0.9rem 1.4rem;
    display:flex;flex-direction:column;
    box-shadow:
      0 20px 50px -20px rgba(26,24,20,0.2),
      0 6px 16px -8px rgba(26,24,20,0.12);
    transition:border-color .25s, box-shadow .25s;
  }
  .input-bar:focus-within{
    border-color:var(--gold-deep);
    box-shadow:
      0 20px 50px -20px rgba(184,136,74,0.3),
      0 6px 16px -8px rgba(184,136,74,0.2);
  }
  .input-row{
    display:flex;align-items:center;gap:0.8rem;
    width:100%;
  }
  #msg-input{
    flex:1;
    border:none;outline:none;
    background:transparent;
    font-family:'Fraunces',serif;
    font-size:1.05rem;
    color:var(--ink);
    padding:0.5rem 0;
    line-height:1.4;
    resize:none;
    max-height:120px;
    min-height:1.5em;
    overflow-y:auto;
  }
  #msg-input::placeholder{
    color:var(--ink-soft);
    opacity:0.55;
    font-style:italic;
    font-family:'Instrument Serif',serif;
  }
  .input-controls{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:0.7rem;
    padding-top:0.7rem;
    border-top:1px solid var(--line);
  }
  .input-controls-left{
    display:flex;align-items:center;gap:0.5rem;
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:10px;
    background:transparent;
    border:1px solid transparent;
    color:var(--ink-soft);
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .2s, color .2s, border-color .2s;
  }
  .icon-btn:hover{background:var(--cream-deep);color:var(--ink);}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.active{
    color:var(--rust);
    background:rgba(164,57,28,0.08);
    border-color:rgba(164,57,28,0.2);
  }

  /* language chip */
  .lang-chip{
    display:inline-flex;align-items:center;gap:0.5rem;
    padding:0.4rem 0.8rem 0.4rem 0.5rem;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    cursor:pointer;
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    color:var(--ink);
    transition:border-color .2s, background .2s;
  }
  .lang-chip:hover{border-color:var(--gold-deep);background:rgba(184,136,74,0.06);}
  .lang-chip .flag{
    width:22px;height:22px;
    border-radius:50%;
    overflow:hidden;
    background:#ccc;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:0.9rem;
  }
  .lang-chip .chev{opacity:0.6;font-size:0.6em;}

  /* send button */
  .send-btn{
    width:42px;height:42px;
    border-radius:50%;
    background:var(--ink);
    color:var(--cream);
    border:none;
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background .2s, transform .2s;
  }
  .send-btn:hover{background:var(--rust);transform:scale(1.05);}
  .send-btn:disabled{
    background:var(--line-strong);
    cursor:not-allowed;
    transform:none;
  }
  .send-btn svg{width:18px;height:18px;}

  /* language menu popover */
  .lang-menu{
    position:absolute;
    bottom:calc(100% + 10px);
    left:0;
    background:var(--paper);
    border:1px solid var(--line-strong);
    border-radius:14px;
    padding:0.6rem;
    box-shadow:0 20px 50px -10px rgba(26,24,20,0.25);
    display:none;
    flex-direction:column;
    gap:0.2rem;
    min-width:160px;
    z-index:20;
  }
  .lang-menu.open{display:flex;}
  .lang-menu button{
    background:transparent;border:none;
    text-align:left;
    padding:0.55rem 0.7rem;
    border-radius:8px;
    cursor:pointer;
    font-family:'Fraunces',serif;
    font-size:0.95rem;
    color:var(--ink);
    display:flex;align-items:center;gap:0.6rem;
    transition:background .15s;
  }
  .lang-menu button:hover{background:var(--cream-deep);}
  .lang-menu button.active{background:rgba(184,136,74,0.1);color:var(--rust);}
  .lang-wrap{position:relative;}

  /* small print at the very bottom */
  .input-footnote{
    text-align:center;
    margin-top:0.8rem;
    font-family:'JetBrains Mono',monospace;
    font-size:0.62rem;
    color:var(--ink-soft);
    opacity:0.55;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }

  /* mic recording state */
  .icon-btn.mic.recording{
    color:var(--rust);
    animation:mic-pulse 1.2s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(164,57,28,0.4);}
    50%{box-shadow:0 0 0 8px rgba(164,57,28,0);}
  }

  /* ============ DIAGNOSTIC PANEL ============ */
  #diag-panel{
    position:fixed;
    top:0;right:-360px;
    width:340px;
    height:100vh;
    background:var(--paper);
    border-left:1px solid var(--line-strong);
    box-shadow:-8px 0 30px -8px rgba(26,24,20,0.18);
    display:flex;flex-direction:column;
    z-index:100;
    transition:right .3s cubic-bezier(.2,.7,.2,1);
    font-family:'JetBrains Mono',monospace;
  }
  #diag-panel.open{ right:0; }
  #diag-panel-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1rem 1rem 0.75rem;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  #diag-panel-header h3{
    font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--rust);margin:0;
  }
  #diag-close{
    background:none;border:none;cursor:pointer;
    color:var(--ink-soft);font-size:1.1rem;padding:2px 6px;
    border-radius:6px;
  }
  #diag-close:hover{background:var(--cream-deep);}
  #diag-mic-row{
    padding:0.6rem 1rem;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    display:flex;align-items:center;gap:8px;
    font-size:0.65rem;color:var(--ink-soft);
  }
  #diag-mic-bar-wrap{
    flex:1;height:6px;border-radius:3px;
    background:var(--line-strong);overflow:hidden;
  }
  #diag-mic-fill{
    height:100%;width:0%;border-radius:3px;
    background:var(--gold);
    transition:width .1s;
  }
  #diag-mic-label{ min-width:60px; }
  #diag-mic-warn{ color:var(--rust); }
  #diag-device-row{
    padding:0.4rem 0.8rem 0.5rem;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    display:flex;align-items:center;gap:6px;
    font-size:0.63rem;font-family:'JetBrains Mono',monospace;
  }
  #diag-device-row label{
    color:var(--ink-soft);white-space:nowrap;flex-shrink:0;
  }
  #diag-mic-select{
    flex:1;min-width:0;
    font-family:'JetBrains Mono',monospace;
    font-size:0.62rem;
    background:var(--cream-deep,#e8e2d9);
    border:1px solid var(--line-strong);
    border-radius:5px;
    color:var(--ink);
    padding:3px 4px;
    cursor:pointer;
  }
  #diag-mic-select option.device-active{
    font-weight:700;color:var(--rust);
  }
  #diag-refresh-devices{
    background:none;border:1px solid var(--line-strong);
    border-radius:5px;padding:2px 7px;cursor:pointer;
    font-size:0.8rem;color:var(--ink-soft);flex-shrink:0;
  }
  #diag-refresh-devices:hover{background:var(--line-strong);}
  #diag-actions{

  }
  #diag-mic-test{
    background:var(--cream-deep,#e8e2d9);
    border:1px solid var(--line-strong);

  #diag-feed{

  .diag-row{

  .diag-row .diag-ts{

  .diag-row.stt{

  .diag-row.bot{

  .diag-row.info{

  #diag-toggle{
    position:fixed;
    right:0;top:50%;

<script src="https://unpkg.com/@daily-co/daily-js"></script>
<script>
/* =============================================================
   Voxtera demo page
   ============================================================ */
(function() {
  // ─── elements ───
  const orbWrap     = document.getElementById('orb-wrap');
  const callBtn     = document.getElementById('call-btn');
  const caption     = document.getElementById('stage-caption');
  const sessionLbl  = document.getElementById('session-label');
  const transcript  = document.getElementById('transcript');
  const form        = document.getElementById('chat-form');
  const input       = document.getElementById('msg-input');
  const sendBtn     = document.getElementById('send-btn');
  const micBtn      = document.getElementById('mic-btn');
  const langBtn     = document.getElementById('lang-btn');
  const langMenu    = document.getElementById('lang-menu');
  const langFlag    = document.getElementById('lang-flag');
  const langLabel   = document.getElementById('lang-label');
  const audioEl     = document.getElementById('bot-audio');
  const remoteAudioEl = document.getElementById('remote-audio');
  const stopBtn     = document.getElementById('stop-btn');

  // ─── state ───
  let currentLang = 'en';
  let sessionId   = null;
  let isBusy      = false;
  let inCall      = false;
  let callRecognition = null;
  let micRecognition  = null;
  let micActive       = false;
  let _currentAbort   = null;   // AbortController for in-flight fetch
  let _audioQueue     = [];     // shared audio queue ref for stop
  let _audioEl        = audioEl;
  let _selectedMicDeviceId = null;  // synced with the panel dropdown

  // ─── diagnostic panel ───
  const diagPanel   = document.getElementById('diag-panel');
  const diagToggle  = document.getElementById('diag-toggle');
  const diagFeed    = document.getElementById('diag-feed');
  const diagFill    = document.getElementById('diag-mic-fill');
  const diagWarn    = document.getElementById('diag-mic-warn');
  const diagLabel   = document.getElementById('diag-mic-label');

  document.getElementById('diag-close').addEventListener('click', () => {
    diagPanel.classList.remove('open');
    diagToggle.classList.remove('open');
  });
  diagToggle.addEventListener('click', () => {
    diagPanel.classList.toggle('open');
    diagToggle.classList.toggle('open');
  });

  function diagLog(type, text) {
    const row = document.createElement('div');
    row.className = 'diag-row ' + type;
    const ts = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    row.innerHTML = '<span class="diag-ts">' + ts + '</span>' + _escHtml(text);
    diagFeed.appendChild(row);
    diagFeed.scrollTop = diagFeed.scrollHeight;
    // Keep max 200 rows
    while (diagFeed.children.length > 200) diagFeed.removeChild(diagFeed.firstChild);
  }

  function _escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ─── mic device selector ───
  const diagMicSelect = document.getElementById('diag-mic-select');

  async function _populateMicSelect(withPermission) {
    try {
      // If called with withPermission=true (after mic test grants access),
      // re-enumerate to get real labels. Otherwise just enumerate — Safari
      // blocks getUserMedia outside a user gesture so we never call it here.
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter(d => d.kind === 'audioinput');

      diagMicSelect.innerHTML = '';
      mics.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        const label = d.label || ('Mic ' + d.deviceId.substring(0, 8));
        opt.textContent = label;
        if (d.deviceId === _selectedMicDeviceId) {
          opt.selected = true;
          opt.className = 'device-active';
          opt.textContent = '✔ ' + label;
        }
        if (/aggregate|blackhole|virtual|loopback|teams/i.test(label)) {
          opt.textContent = (opt.selected ? '✔ ' : '⚠ ') + label;
        }
        diagMicSelect.appendChild(opt);
      });

      // Auto-pick built-in if nothing selected yet
      if (!_selectedMicDeviceId) {
        const builtIn = mics.find(d =>
          /macbook|built.in|internal/i.test(d.label) &&
          !/aggregate|blackhole|loopback|teams|virtual/i.test(d.label)
        );
        if (builtIn) {
          diagMicSelect.value = builtIn.deviceId;
          _selectedMicDeviceId = builtIn.deviceId;
        } else if (mics.length > 0) {
          // Fallback: pick first non-virtual device
          const first = mics.find(d => !/aggregate|blackhole|virtual|loopback|teams/i.test(d.label)) || mics[0];
          diagMicSelect.value = first.deviceId;
          _selectedMicDeviceId = first.deviceId;
        }
      }

      const selLabel = diagMicSelect.options[diagMicSelect.selectedIndex]
        ? diagMicSelect.options[diagMicSelect.selectedIndex].textContent.replace(/^[✔⚠] /, '')
        : 'none';
      diagLog('info', 'Found ' + mics.length + ' mic(s). Selected: ' + selLabel);
    } catch (e) {
      diagLog('warn', '⚠ Device scan failed: ' + (e && e.message));
    }
  }

  diagMicSelect.addEventListener('change', () => {
    _selectedMicDeviceId = diagMicSelect.value || null;
    const label = diagMicSelect.options[diagMicSelect.selectedIndex]
      ? diagMicSelect.options[diagMicSelect.selectedIndex].textContent.replace(/^[✔⚠] /, '')
      : '?';
    diagLog('info', '🎤 Mic switched → ' + label);
    // Restart the level monitor with the new device
    if (_micMonitorInterval) _startMicMonitor();
  });

  document.getElementById('diag-refresh-devices').addEventListener('click', () => {
    diagLog('info', '🔄 Re-scanning devices…');
    _populateMicSelect();
  });

  // ─── mic test button ───
  let _micTestAbort = false;

  document.getElementById('diag-mic-test').addEventListener('click', async function() {
    const btn = this;

    // Second click while recording → stop early
    if (btn.dataset.testing === 'recording') {
      _micTestAbort = true;
      return;
    }
    if (btn.dataset.testing) return; // playing back, ignore

    _micTestAbort = false;
    btn.dataset.testing = 'recording';
    btn.classList.add('recording');
    btn.textContent = '⏹ Stop recording';

    // ⚠ getUserMedia MUST be the first await — no prior awaits allowed.
    // Any await before this (enumerateDevices, etc.) breaks Safari's user-gesture
    // chain and the permission prompt will never appear.
    // Step 1: request with no constraints to trigger permission prompt.
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      diagLog('warn', '⚠ getUserMedia failed: ' + e.message);
      diagLog('warn', '👉 Safari: allow mic in the browser address bar');
      diagLog('warn', '👉 macOS: System Settings → Privacy → Microphone → enable browser');
      btn.classList.remove('recording');
      btn.textContent = '🎤 Test mic';
      delete btn.dataset.testing;
      return;
    }

    // Step 2: if user has selected a specific device in the dropdown, switch to it.
    // This is safe to do now — permission is already granted.
    const chosenId = diagMicSelect.value;
    if (chosenId && stream.getAudioTracks()[0] &&
        stream.getAudioTracks()[0].getSettings().deviceId !== chosenId) {
      stream.getTracks().forEach(t => t.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { deviceId: { exact: chosenId } }, video: false
        });
      } catch (_) {
        // Couldn't get chosen device — fall back to what we already had
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      }
    }

    // Log what device we actually got — but DO NOT overwrite _selectedMicDeviceId.
    // That value is controlled exclusively by the dropdown.
    // Now that we have permission, re-populate dropdown with real labels.
    _populateMicSelect(true);

    const track = stream.getAudioTracks()[0];
    if (track) {
      const settings = track.getSettings();
      const gotLabel = track.label || '(no label)';
      const selectedLabel = diagMicSelect.options[diagMicSelect.selectedIndex]
        ? diagMicSelect.options[diagMicSelect.selectedIndex].textContent.replace(/^[✔⚠] /, '')
        : '?';
      if (chosenId && settings.deviceId !== chosenId) {
        diagLog('warn', '⚠ Asked for: ' + selectedLabel);
        diagLog('warn', '⚠ Got instead: ' + gotLabel + ' — Chrome ignored deviceId');
        diagLog('warn', '👉 Change macOS default input in Audio MIDI Setup');
      } else {
        diagLog('info', '🎤 Testing: ' + gotLabel);
      }
      diagLog('info', 'sampleRate=' + settings.sampleRate
        + '  ch=' + settings.channelCount
        + '  echo=' + settings.echoCancellation
        + '  noise=' + settings.noiseSuppression);
    }

    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    const analyser = ac.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    const buf = new Float32Array(analyser.frequencyBinCount);

    const chunks = [];
    const rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    rec.start();

    let maxRms = 0;
    const startMs = Date.now();
    const MAX_MS = 10000;

    while (!_micTestAbort && (Date.now() - startMs) < MAX_MS) {
      await new Promise(r => setTimeout(r, 150));
      analyser.getFloatTimeDomainData(buf);
      let rms = 0;
      for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / buf.length);
      if (rms > maxRms) maxRms = rms;
      const pct = Math.min(100, rms * 800);
      if (diagFill) diagFill.style.width = pct + '%';
      if (diagLabel) diagLabel.textContent = 'MIC ' + (rms * 1000).toFixed(1);
      const elapsed = ((Date.now() - startMs) / 1000).toFixed(1);
      btn.textContent = '⏹ ' + elapsed + 's — click to stop';
    }

    rec.stop();
    stream.getTracks().forEach(t => t.stop());
    try { ac.close(); } catch(_) {}
    await new Promise(r => rec.onstop = r);

    const blob = new Blob(chunks, { type: 'audio/webm' });
    const kb = (blob.size / 1024).toFixed(1);
    const hasAudio = maxRms > 0.005;

    diagLog(hasAudio ? 'stt' : 'warn',
      (hasAudio ? '✅' : '⚠') + ' ' + kb + ' KB  peak RMS=' + maxRms.toFixed(4) + ' — '
      + (hasAudio ? 'audio captured ✔' : 'SILENT — mic not sending audio'));

    if (!hasAudio) {
      diagLog('warn', '👉 macOS: System Settings → Privacy & Security → Microphone → enable Chrome');
      diagLog('warn', '👉 macOS: Audio MIDI Setup → MacBook Pro Mic → check input level bar moves');
      btn.classList.remove('recording');
      btn.textContent = '🎤 Test mic';
      delete btn.dataset.testing;
      return;
    }

    const url = URL.createObjectURL(blob);
    btn.classList.remove('recording');
    btn.classList.add('playing');
    btn.textContent = '▶ Playing back…';
    btn.dataset.testing = 'playing';
    const a = new Audio(url);
    a.onended = () => {
      URL.revokeObjectURL(url);
      btn.classList.remove('playing');
      btn.textContent = '🎤 Test mic';
      delete btn.dataset.testing;
      diagLog('info', '⏹ Playback done');
    };
    a.play().catch(err => {
      diagLog('warn', '⚠ Playback failed: ' + err.message);

  // ─── core: send text to /api/chat and play audio response ───
  async function sendMessage(text) {
    if (isBusy || !text.trim()) return;
    isBusy = true;
    sendBtn.disabled = true;
    _showStop(true);

    addMessage('user', text);
    setOrbState('listening');
    setStatus('<strong>Voxtera is thinking…</strong>', 'Thinking');

    // Create bot bubble immediately — text streams into it
    const botWrap   = document.createElement('div');
    botWrap.className = 'msg bot';
    const botLabel  = document.createElement('div');
    botLabel.className = 'who';
    botLabel.textContent = 'Voxtera';
    const botBubble = document.createElement('div');
    botBubble.className = 'bubble typing';
    botWrap.appendChild(botLabel);
    botWrap.appendChild(botBubble);
    transcript.appendChild(botWrap);
    transcript.scrollTop = transcript.scrollHeight;

    let fullText = '';
    // Audio queue — plays clips sequentially without overlap
    const audioQueue = [];
    _audioQueue = audioQueue;
    let audioPlaying = false;
    let allAudioDoneResolve = null;
    const allAudioDone = new Promise(resolve => { allAudioDoneResolve = resolve; });
    function enqueueAudio(b64) {
      audioQueue.push(b64);
      if (!audioPlaying) _playNextAudio();
    }
    function _playNextAudio() {
      if (audioQueue.length === 0) {
        audioPlaying = false;
        if (allAudioDoneResolve) allAudioDoneResolve();
        return;
      }
      audioPlaying = true;
      const b64 = audioQueue.shift();
      audioEl.src = 'data:audio/mpeg;base64,' + b64;
      audioEl.onended = () => _playNextAudio();
      audioEl.onerror = () => _playNextAudio();
      audioEl.play().catch(() => _playNextAudio());
    }

    _currentAbort = new AbortController();
    try {
      const resp = await fetch('/api/chat', {
        signal: _currentAbort.signal,
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: text.trim(),
          session_id: sessionId,
          model: 'gpt-4o-mini',
          language: currentLang === 'auto' ? 'en' : currentLang,
          tts_provider: 'elevenlabs',
          voice: '21m00Tcm4TlvDq8ikWAM'
        })
      });

      if (!resp.ok || !resp.body) throw new Error(`HTTP ${resp.status}`);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let lineBuf   = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        lineBuf += decoder.decode(value, { stream: true });
        const lines = lineBuf.split('\n');
        lineBuf = lines.pop(); // keep incomplete last line

        for (const line of lines) {
          if (!line.trim()) continue;
          let event;
          try { event = JSON.parse(line); } catch { continue; }

          if (event.type === 'text') {
            fullText += event.chunk;
            botBubble.textContent = fullText;
            transcript.scrollTop = transcript.scrollHeight;

          } else if (event.type === 'audio') {
            setOrbState('speaking');
            setStatus('<strong>Voxtera is speaking…</strong>', 'Speaking');
            enqueueAudio(event.data);

          } else if (event.type === 'done') {
            sessionId = event.session_id;
            botBubble.classList.remove('typing');

          } else if (event.type === 'error') {
            botBubble.textContent = 'Error: ' + event.error;
            botBubble.classList.remove('typing');
          }
        }
      }

      // signal queue that no more audio events are coming, then wait
      if (!audioPlaying && audioQueue.length === 0) allAudioDoneResolve();
      await allAudioDone;

    } catch (e) {
      if (e.name !== 'AbortError') {
        botBubble.textContent = botBubble.textContent || ('Network error: ' + e.message);
        botBubble.classList.remove('typing');
        setOrbState('');
        setStatus(`Network error: ${e.message}`, 'Error');
      } else {
        botBubble.classList.remove('typing');
      }
    }

    // resume voice call or go idle
    if (inCall && callRecognition) {
      setOrbState('listening');
      setStatus('<strong>Listening…</strong> Speak naturally. Tap again to end.', 'In call');
      try { callRecognition.start(); } catch (e) {}
    } else {
      setOrbState('');
      setStatus('Ready when you are.', 'Ready');
      const sugEl = document.getElementById('suggestions');
      if (sugEl) {
        sugEl.style.display = '';
        sugEl.style.opacity = '1';
        updateChips(currentLang);
      }
    }

    isBusy = false;
    sendBtn.disabled = false;
    _currentAbort = null;
    _showStop(false);
  }

  // ─── Daily.co voice call helpers ───────────────────────────────────
  async function _startVoiceCall() {
    if (!window.DailyIframe) {
      setStatus('<strong>Daily SDK not loaded.</strong> Please refresh.', 'Error');
      return;
    }
    callBtn.disabled = true;
    setOrbState('listening');
    setStatus('<strong>Starting voice session…</strong>', 'Connecting');

    // Resume AudioContext inside the user gesture so Safari allows audio.
    try {
      const _ac = new (window.AudioContext || window.webkitAudioContext)();
      if (_ac.state === 'suspended') _ac.resume();
    } catch (_) {}

    let roomUrl, sessionId;
    try {
      const resp = await fetch('/api/start-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          language: currentLang === 'auto' ? 'multi' : currentLang,
          llm: 'claude-haiku-4-5',
          stt: 'gladia',
          ttsProvider: 'elevenlabs',
          voice: '21m00Tcm4TlvDq8ikWAM'
        })
      });
      if (resp.status === 409) {
        setStatus('<strong>Session busy.</strong> Another call is active — try again shortly.', 'Busy');
        callBtn.disabled = false;
        setOrbState('');
        return;
      }
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      roomUrl   = data.room_url;
      sessionId = data.session_id;
    } catch (e) {
      setStatus(`<strong>Could not start session:</strong> ${e.message}`, 'Error');
      callBtn.disabled = false;
      setOrbState('');
      return;
    }

    _dailySessionId = sessionId;

    // Use the device selected in the panel dropdown (or default if none chosen)
    const _audioSource = _selectedMicDeviceId || true;

    try {
      _dailyCallObj = window.DailyIframe.createCallObject({ audioSource: _audioSource, videoSource: false });
    } catch (e) {
      diagLog('warn', '⚠ createCallObject failed: ' + (e && e.message) + ' — retrying with default');
      _dailyCallObj = window.DailyIframe.createCallObject({ audioSource: true, videoSource: false });
    }

    let _greetingReadySent = false;

    function _sendVoxteraReady() {
      if (!_greetingReadySent && _dailyCallObj) {
        _greetingReadySent = true;
        diagLog('info', '▶ Sending voxtera-ready → greeting trigger');
        _dailyCallObj.sendAppMessage({ type: 'voxtera-ready' }, '*');
      }
    }

    _dailyCallObj.on('participant-joined', (evt) => {
      // When the bot joins, send config app-messages so it knows which
      // language/TTS/STT/model to use before playing the greeting.
      if (!evt.participant.local) {
        diagLog('info', '🤖 Bot joined Daily room — sending config');
        _dailyCallObj.sendAppMessage({ type: 'voxtera-stt',          provider: 'gladia' }, '*');
        _dailyCallObj.sendAppMessage({ type: 'voxtera-language',     language: currentLang === 'auto' ? 'multi' : currentLang }, '*');
        _dailyCallObj.sendAppMessage({ type: 'voxtera-timezone',     tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || '') }, '*');
        _dailyCallObj.sendAppMessage({ type: 'voxtera-model',        model: 'claude-haiku-4-5' }, '*');
        _dailyCallObj.sendAppMessage({ type: 'voxtera-tts-provider', provider: 'elevenlabs' }, '*');
        _dailyCallObj.sendAppMessage({ type: 'voxtera-voice',        voice: '21m00Tcm4TlvDq8ikWAM' }, '*');
        // Fallback: if audio track never becomes playable, still trigger greeting after 4s.
        setTimeout(_sendVoxteraReady, 4000);
      }
    });

    _dailyCallObj.on('participant-updated', (evt) => {
      // Orb state is managed by app-message events (bot-speaking/bot-stopped).
      // Do not update orb here — participant-updated fires for track state
      // changes unrelated to the bot actually speaking.
    });

    _dailyCallObj.on('app-message', (evt) => {
      const msg = evt.data;
      if (!msg || msg.type !== 'voxtera-event') return;
      if (msg.event === 'bot-reply') {
        const text = msg.data && msg.data.text ? msg.data.text : '';
        addMessage('bot', text);
        diagLog('bot', '🤖 BOT: ' + text);
        setOrbState('speaking');
        setStatus('<strong>Voxtera is speaking…</strong>', 'Speaking');
      } else if (msg.event === 'user-transcript') {
        const text = msg.data && msg.data.text ? msg.data.text : '';
        addMessage('user', text);
        diagLog('stt', '✅ STT: ' + text);
      } else if (msg.event === 'user-started') {
        diagLog('vad-start', '🎤 VAD: user started speaking');
      } else if (msg.event === 'user-stopped') {
        diagLog('vad-stop', '🔇 VAD: user stopped speaking');
      } else if (msg.event === 'bot-thinking') {
        diagLog('info', '💭 LLM thinking…');
      } else if (msg.event === 'bot-speaking') {
        setOrbState('speaking');
        setStatus('<strong>Voxtera is speaking…</strong>', 'Speaking');
        diagLog('bot', '🔊 Bot speaking');
      } else if (msg.event === 'bot-done-speaking') {
        setOrbState('listening');
        setStatus('<strong>Listening…</strong> Speak naturally. Tap the phone to end.', 'In call');
        diagLog('info', '⏹ Bot done speaking');
      }
    });

    _dailyCallObj.on('track-started', (evt) => {
      if (!evt.participant.local && evt.track && evt.track.kind === 'audio') {
        diagLog('info', '🔉 Remote audio track started');
        try {
          const ms = new MediaStream([evt.track]);
          remoteAudioEl.srcObject = ms;
          remoteAudioEl.play().then(() => {
            diagLog('info', '▶ Remote audio playing — triggering greeting');
            // Audio is confirmed playing — now tell the bot to speak the greeting.
            _sendVoxteraReady();
          }).catch((e) => {
            diagLog('warn', '⚠ play() failed: ' + (e && e.message) + ' — sending ready anyway');
            // play() failed (autoplay policy) — send voxtera-ready anyway.
            _sendVoxteraReady();
          });
        } catch (_) {}
        setOrbState('listening');
        setStatus('<strong>Listening…</strong> Speak naturally. Tap the phone to end.', 'In call');
      }
    });

    _dailyCallObj.on('track-stopped', (evt) => {
      if (!evt.participant || !evt.participant.local) {
        if (inCall) {
          setOrbState('listening');
          setStatus('<strong>Listening…</strong> Speak naturally. Tap to end.', 'In call');
        }
      }
    });

    _dailyCallObj.on('participant-left', (evt) => {
      // Bot left — hang up cleanly from our side too.
      if (!evt.participant.local) _endVoiceCall(false);
    });

    _dailyCallObj.on('left-meeting', () => {
      _cleanupDailyCall();
    });

    _dailyCallObj.on('error', (e) => {
      setStatus(`<strong>Call error:</strong> ${e.errorMsg || 'unknown'}`, 'Error');
      _endVoiceCall(true);
    });

    try {
      diagLog('info', '📡 Joining Daily room: ' + roomUrl);
      await _dailyCallObj.join({ url: roomUrl, startAudioOff: false, userName: 'Guest' });
      diagLog('info', '✅ Joined Daily room');
    } catch (e) {
      setStatus(`<strong>Failed to join room:</strong> ${e.message}`, 'Error');
      _endVoiceCall(true);
      return;
    }

    inCall = true;
    callBtn.disabled = false;
    callBtn.classList.add('in-call');
    callBtn.setAttribute('aria-label', 'End voice call');
    // Change phone icon to hang-up (rotated)
    callBtn.style.transform = 'rotate(135deg)';
    setOrbState('listening');
    setStatus('<strong>Listening…</strong> Speak naturally. Tap the phone to end.', 'In call');
    const sugEl = document.getElementById('suggestions');
    if (sugEl) { sugEl.style.opacity = '0'; sugEl.style.pointerEvents = 'none'; }
    _startCallTimer();
    // Auto-open diagnostic panel when call starts
    diagPanel.classList.add('open');
    diagToggle.classList.add('open');
    diagLog('info', '📞 Voice call started — session ' + (sessionId || '?'));
    _startMicMonitor();
  }

  // ─── mic level monitor ───
  let _micMonitorInterval = null;
  let _micAnalyser = null;

  function _startMicMonitor() {
    _stopMicMonitor();
    diagLog('info', '🎙 Mic monitor starting…');
    let silentFrames = 0;
    const constraints = { video: false, audio: _selectedMicDeviceId
      ? { deviceId: { exact: _selectedMicDeviceId } }
      : true };
    try {
      navigator.mediaDevices.getUserMedia(constraints).then(stream => {
        const track = stream.getAudioTracks()[0];
        if (track) diagLog('info', 'Monitor track: ' + track.label);
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const src = ac.createMediaStreamSource(stream);
        const analyser = ac.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        _micAnalyser = { ac, stream, analyser };
        const buf = new Float32Array(analyser.frequencyBinCount);
        _micMonitorInterval = setInterval(() => {
          analyser.getFloatTimeDomainData(buf);
          let rms = 0;
          for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
          rms = Math.sqrt(rms / buf.length);
          const pct = Math.min(100, rms * 800);
          if (diagFill) diagFill.style.width = pct + '%';
          if (diagLabel) diagLabel.textContent = 'MIC ' + (rms * 1000).toFixed(1);
          if (diagWarn) {
            if (rms < 0.005) {
              silentFrames++;
              if (silentFrames > 10) {
                diagWarn.textContent = '⚠ silent';
                if (silentFrames === 11) diagLog('warn', '⚠ Mic silent — no audio reaching browser');
              }
            } else {
              if (silentFrames > 10) diagLog('info', '✅ Mic active (RMS=' + rms.toFixed(4) + ')');
              silentFrames = 0;
              diagWarn.textContent = '';
            }
          }
        }, 200);
      }).catch(e => {
        diagLog('warn', '⚠ getUserMedia failed: ' + (e && e.message));
      });
    } catch (e) {
      diagLog('warn', '⚠ Mic monitor error: ' + (e && e.message));
    }
  }

  function _stopMicMonitor() {
    if (_micMonitorInterval) { clearInterval(_micMonitorInterval); _micMonitorInterval = null; }
    if (_micAnalyser) {
      try { _micAnalyser.stream.getTracks().forEach(t => t.stop()); } catch (_) {}
      try { _micAnalyser.ac.close(); } catch (_) {}
      _micAnalyser = null;
    }
    if (diagFill) diagFill.style.width = '0%';
    if (diagLabel) diagLabel.textContent = 'MIC —';
    if (diagWarn) diagWarn.textContent = '';
  }

  async function _endVoiceCall(alsoHitServer = true) {
    _stopCallTimer();
    _stopMicMonitor();
    inCall = false;
    callBtn.classList.remove('in-call');
    callBtn.setAttribute('aria-label', 'Start voice call');
    callBtn.style.transform = '';
    callBtn.disabled = false;

    // Stop remote audio immediately.
    remoteAudioEl.pause();
    remoteAudioEl.srcObject = null;

    // Leave the Daily room from our side.
    if (_dailyCallObj) {
      try { await _dailyCallObj.leave(); } catch (_) {}
      try { _dailyCallObj.destroy(); } catch (_) {}
      _dailyCallObj = null;
    }

    // Tell the server to SIGTERM the bot and eject everyone from Daily.
    // This is the critical step that stops Daily billing.
    if (alsoHitServer && _dailySessionId) {
      try {
        await fetch('/api/end-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: _dailySessionId })
        });
      } catch (_) {}
    }
    _dailySessionId = null;

    setOrbState('');
    setStatus('Voice session ended.', 'Ready');
    addMessage('bot', '— Voice session ended —');
    const sugEl = document.getElementById('suggestions');
    if (sugEl) { sugEl.style.opacity = '1'; sugEl.style.pointerEvents = ''; }
  }

  function _cleanupDailyCall() {
    if (_dailyCallObj) {
      try { _dailyCallObj.destroy(); } catch (_) {}
      _dailyCallObj = null;
    }
  }

  // ─── session countdown timer (3 min max) ──────────────────────────────
  // Shows a visible warning at 2:45 so the user isn't surprised when
  // the server's watchdog disconnects them at 3:00.
  const _MAX_CALL_MS   = 180000; // 3 min — must match serve.py
  const _WARN_CALL_MS  = 165000; // 2:45
  let _callStartTime   = null;
  let _countdownTimer  = null;
  let _warnShown       = false;

  function _startCallTimer() {
    _callStartTime = Date.now();
    _warnShown = false;
    _countdownTimer = setInterval(() => {
      if (!inCall) { clearInterval(_countdownTimer); _countdownTimer = null; return; }
      const elapsed = Date.now() - _callStartTime;
      const remaining = _MAX_CALL_MS - elapsed;
      if (remaining <= 0) {
        clearInterval(_countdownTimer);
        _countdownTimer = null;
        return;
      }
      // Show warning at 15 s remaining
      if (!_warnShown && elapsed >= _WARN_CALL_MS) {
        _warnShown = true;
        const secs = Math.ceil(remaining / 1000);
        setStatus(
          `<strong>⚠ Session ending in ${secs}s</strong> — maximum call duration reached.`,
          'Ending soon'
        );
      }
    }, 500);
  }

  function _stopCallTimer() {
    if (_countdownTimer) { clearInterval(_countdownTimer); _countdownTimer = null; }
    _callStartTime = null;
    _warnShown = false;
  }

    ],

      { prompt: 'Можно ли сделать поздний выезд?',      label: 'Поздний выезд' },

    ar: [
      { prompt: 'ما هي كلمة مرور WiFi؟',               label: 'كلمة مرور WiFi' },
      { prompt: 'هل توجد مطاعم جيدة بالقرب؟',         label: 'مطاعم قريبة' },

      { prompt: 'WiFiのパスワードを教えてください',         label: 'WiFiパスワード' },

      { prompt: '游泳池现在开放吗？',                   label: '游泳池时间' },

    auto: [
      { prompt: "What's the WiFi password?",              label: 'WiFi password?' },

      { prompt: 'What are the spa opening hours?',        label: 'Spa hours' },
      { prompt: 'Can you recommend something to do in Paris?', label: 'Things to do' },
    ],
  };

  const PLACEHOLDERS = {
    en: 'Send a message to start a chat',
    fr: 'Envoyez un message pour commencer',
    es: 'Envíe un mensaje para comenzar',
    de: 'Nachricht senden, um zu beginnen',
    it: 'Invia un messaggio per iniziare',
    pt: 'Envie uma mensagem para começar',
    tr: 'Başlamak için bir mesaj gönderin',
    ru: 'Отправьте сообщение чтобы начать',
    ar: 'أرسل رسالة للبدء',
    ja: 'メッセージを送って開始',
    zh: '发送消息开始对话',
    auto: 'Send a message to start a chat',
  };

  function updateChips(lang) {
    const chips = CHIPS[lang] || CHIPS.en;
    const el = document.getElementById('suggestions');
    if (!el || el.style.display === 'none') return;
    el.innerHTML = chips.map(c =>
      `<button class="chip" data-prompt="${c.prompt.replace(/"/g, '&quot;')}">${c.label}</button>`
    ).join('');
    el.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        sendMessage(chip.dataset.prompt);
      });
    });
  }

  // ─── language menu ───
  langBtn.addEventListener('click', e => {
    e.stopPropagation();
    langMenu.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!langMenu.contains(e.target) && e.target !== langBtn) {
      langMenu.classList.remove('open');
    }
  });
  langMenu.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const lang  = btn.dataset.lang;
      const flag  = btn.dataset.flag;
      const label = btn.textContent.replace(/^\S+\s/, '');
      langFlag.textContent  = flag;
      langLabel.textContent = label;
      currentLang = lang;
      langMenu.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      langMenu.classList.remove('open');
      if (micRecognition)  micRecognition.lang  = lang === 'auto' ? '' : lang;
      if (callRecognition) callRecognition.lang = lang === 'auto' ? '' : lang;
      // Live-switch STT language on the bot if a call is active
      if (_dailyCallObj) {
        _dailyCallObj.sendAppMessage({ type: 'voxtera-language', language: lang === 'auto' ? 'multi' : lang }, '*');
      }
      // update chips and placeholder
      updateChips(lang);
      input.placeholder = PLACEHOLDERS[lang] || PLACEHOLDERS.en;
      // RTL support for Arabic
      input.dir = lang === 'ar' ? 'rtl' : 'ltr';
    });
  });

  // ─── settings button (placeholder) ───
  document.getElementById('settings-btn').addEventListener('click', () => {
    alert('Settings: in the next version you will be able to pick voice, LLM model, and TTS provider here.');
  });

  // ─── welcome message on load — spoken aloud via TTS ───
  async function playWelcome() {
    const welcomeText = 'Hello, and a very warm welcome. It\u2019s a pleasure to have you with us \u2014 I\u2019m Voxtera, your concierge at Grand H\u00f4tel Lumi\u00e8re. I speak any language you prefer. Feel free to ask me about room amenities, restaurants, the spa, pool hours, local tips, or anything else about your stay.';

    // render the bubble immediately
    const wrap   = document.createElement('div');
    wrap.className = 'msg bot';
    const lbl    = document.createElement('div');
    lbl.className = 'who';
    lbl.textContent = 'Voxtera';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = welcomeText;
    wrap.appendChild(lbl);
    wrap.appendChild(bubble);
    transcript.appendChild(wrap);
    transcript.scrollTop = transcript.scrollHeight;

    // speak it — /api/tts-test returns raw audio/mpeg bytes
    setOrbState('speaking');
    setStatus('<strong>Voxtera is speaking\u2026</strong>', 'Speaking');
    try {
      const resp = await fetch('/api/tts-test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider: 'elevenlabs', voice: '21m00Tcm4TlvDq8ikWAM', language: 'en' })
      });
      if (resp.ok) {
        const blob = await resp.blob();
        const url  = URL.createObjectURL(blob);
        audioEl.src = url;
        await audioEl.play().catch(() => {});
        await new Promise(resolve => { audioEl.onended = resolve; audioEl.onerror = resolve; });
        URL.revokeObjectURL(url);
      }
    } catch (e) {
      // TTS unavailable — bubble already visible, continue silently
    }
    setOrbState('');
    setStatus('Tap the orb, or send a message below to begin.', 'Ready');
  }
  setTimeout(playWelcome, 900);

  // initialise chips for default language
  updateChips('en');

  setTimeout(() => input.focus(), 800);

  // Pre-enumerate mic devices at page load so the selector is populated
  _populateMicSelect();
})();
</script>
