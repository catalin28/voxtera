<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxtera Chat Mode</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: system-ui; background: #0f0f1a; color: #e8e8f0; height: 100vh; display: flex; flex-direction: column; margin: 0; }
  header { background: #1a1a2e; border-bottom: 1px solid #a08030; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  header .title { font-size: 20px; margin: 0; }
  header .title span { color: #c9a84c; }
  #meta { color: #aaa; font-size: 12px; }
  #status-bar { background: #25253d; padding: 8px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #333; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; animation: pulse 1s infinite; }
  #status-dot.connected { background: #4caf50; animation: none; }
  #status-dot.speaking { background: #ff9800; animation: none; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  #error-box { background: #3a1a1a; color: #ff8787; padding: 12px; margin: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; display: none; }
  #error-box.show { display: block; }
  #transcript { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 78%; padding: 12px 16px; border-radius: 12px; white-space: pre-wrap; }
  .bubble.user { align-self: flex-end; background: #2a3a5c; }
  .bubble.bot { align-self: flex-start; background: #2a2a40; }
  #chat-controls { background: #1a1a2e; border-top: 1px solid #333; padding: 12px; display: flex; gap: 10px; align-items: center; }
  #input-wrap { display: flex; gap: 10px; flex: 1; }
  #chat-input {
    flex: 1;
    background: #101020;
    border: 1px solid #555;
    color: #e8e8f0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #btn-send { background: #c9a84c; color: #111; }
  #btn-end { background: #ef5350; color: #fff; }
  #btn-send:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1 class="title">Voxtera <span>Chat Mode</span></h1>
  <div style="display:flex; align-items:center; gap:12px;">
    <a href="/trace.html" target="_blank" rel="noopener"
       title="Open pipeline trace dashboard"
       style="font-size:13px; color:#888; text-decoration:none; padding:6px 10px;
              border:1px solid #444; border-radius:5px;">🔬 Trace</a>
    <div id="meta"></div>
  </div>
</header>

<div id="status-bar">
  <div id="status-dot"></div>
  <span id="status-text">Ready</span>
</div>

<div id="error-box"></div>

<div id="transcript"></div>

<form id="chat-controls">
  <div id="input-wrap">
    <input id="chat-input" type="text" placeholder="Type your question..." autocomplete="off" />
    <button id="btn-send" type="submit">Send</button>
  </div>
  <button id="btn-end" type="button">End</button>
</form>

<audio id="bot-audio" playsinline style="display:none"></audio>

<script>
var sessionId = null;
var audioEl = document.getElementById('bot-audio');
var isSending = false;
var qs = new URLSearchParams(window.location.search);
var settings = {
  language: qs.get('language') || 'en',
  llm: qs.get('llm') || 'gpt-4o-mini',
  stt: qs.get('stt') || 'whisper',
  ttsProvider: qs.get('ttsProvider') || 'openai',
  voice: qs.get('voice') || 'nova'
};

function setStatus(state, text) {
  var dot = document.getElementById('status-dot');
  dot.className = state;
  document.getElementById('status-text').textContent = text;
}

function addBubble(role, text) {
  var div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  var transcript = document.getElementById('transcript');
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

function init() {
  document.getElementById('meta').textContent =
    'LLM: ' + settings.llm + ' | TTS: ' + settings.ttsProvider + '/' + settings.voice + ' | Lang: ' + settings.language;
  setStatus('connected', 'Ready');
  document.getElementById('chat-input').focus();
}

async function sendMessage(text) {
  if (isSending || !text) return;
  isSending = true;
  addBubble('user', text);
  document.getElementById('btn-send').disabled = true;
  setStatus('connected', 'Thinking...');

  try {
    var resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text,
        session_id: sessionId,
        model: settings.llm,
        language: settings.language,
        tts_provider: settings.ttsProvider,
        voice: settings.voice
      })
    });
    var data = await resp.json();
    if (data.error) {
      var box = document.getElementById('error-box');
      box.textContent = data.error;
      box.classList.add('show');
      setStatus('connected', 'Error');
    } else {
      sessionId = data.session_id;
      addBubble('bot', data.text);

      if (data.audio) {
        setStatus('speaking', 'Speaking...');
        audioEl.src = 'data:audio/mpeg;base64,' + data.audio;
        audioEl.play().then(function() {
          audioEl.onended = function() { setStatus('connected', 'Ready'); };
        }).catch(function() {
          setStatus('connected', 'Ready');
        });
      } else {
        setStatus('connected', 'Ready');
      }
    }
  } catch (e) {
    var box = document.getElementById('error-box');
    box.textContent = 'Network error: ' + e.message;
    box.classList.add('show');
    setStatus('connected', 'Error');
  } finally {
    isSending = false;
    document.getElementById('btn-send').disabled = false;
    document.getElementById('chat-input').focus();
  }
}

document.getElementById('chat-controls').addEventListener('submit', function(evt) {
  evt.preventDefault();
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendMessage(text);
});

document.getElementById('btn-end').addEventListener('click', function() {
  window.location.href = 'demo.html';
});

init();
</script>
</body>
</html>
