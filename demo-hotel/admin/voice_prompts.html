<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxtera — Voice Concierge Prompts</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#30363d;
  --ink:#e6edf3; --ink-soft:#8b949e; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
header{padding:1.1rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;}
header h1{font-size:1.15rem;margin:0;}
header .sub{color:var(--ink-soft);font-size:0.85rem;}
#token-bar{margin-left:auto;display:flex;gap:0.5rem;align-items:center;}
input[type=password]{background:var(--panel2);border:1px solid var(--border);color:var(--ink);border-radius:6px;padding:0.45rem 0.6rem;width:220px;}
button{background:var(--accent);border:none;color:#0d1117;font-weight:600;border-radius:6px;padding:0.5rem 0.95rem;cursor:pointer;}
button.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--border);}
button:disabled{opacity:0.45;cursor:default;}
main{display:grid;grid-template-columns:330px 1fr;gap:0;min-height:calc(100vh - 64px);}
#list{border-right:1px solid var(--border);overflow-y:auto;}
.item{padding:0.85rem 1.1rem;border-bottom:1px solid var(--border);cursor:pointer;}
.item:hover{background:var(--panel);}
.item.active{background:var(--panel2);border-left:3px solid var(--accent);padding-left:calc(1.1rem - 3px);}
.item .t{font-weight:600;}
.item .f{font-family:ui-monospace,Menlo,monospace;font-size:0.72rem;color:var(--accent);margin-top:1px;}
.item .d{color:var(--ink-soft);font-size:0.8rem;margin-top:0.3rem;}
.badge{display:inline-block;font-size:0.65rem;font-weight:700;letter-spacing:0.5px;color:var(--warn);
  border:1px solid var(--warn);border-radius:4px;padding:0 0.3rem;margin-left:0.4rem;vertical-align:1px;}
#editor{display:flex;flex-direction:column;padding:1.1rem 1.4rem;gap:0.7rem;}
#ed-head .t{font-size:1.05rem;font-weight:700;}
#ed-head .d{color:var(--ink-soft);font-size:0.88rem;margin-top:0.25rem;max-width:70ch;}
textarea{flex:1;min-height:420px;background:var(--panel);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:0.9rem;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical;white-space:pre;}
textarea[readonly]{opacity:0.7;}
#ed-foot{display:flex;align-items:center;gap:0.8rem;}
#status{font-size:0.85rem;color:var(--ink-soft);}
#status.ok{color:var(--ok);} #status.err{color:var(--err);} #status.dirty{color:var(--warn);}
.note{color:var(--ink-soft);font-size:0.8rem;}
#gate{padding:3rem;text-align:center;color:var(--ink-soft);}
#flowwrap{border-bottom:1px solid var(--border);background:var(--panel);padding:0.7rem 1.4rem 0.9rem;}
#flowwrap svg{width:100%;max-width:1180px;height:auto;display:block;margin:0 auto;}
.pnode{cursor:pointer;}
.pnode rect{transition:stroke-width 0.1s;}
.pnode:hover rect{stroke-width:2.2;}
.pnode.sel rect{fill:rgba(88,166,255,0.14);stroke-width:2.2;}
</style>
</head>
<body>
<header>
  <h1>🎙️ Voice Concierge Prompts</h1>
  <span class="sub">Prompts of the hotel voice concierge (the "Her" persona) — the bot reads them at startup, so saves apply from the <b>next call</b>.</span>
  <div id="token-bar">
    <button class="secondary" id="flow-toggle" style="display:none">Flow ▾</button>
    <input type="password" id="token" placeholder="admin token">
    <button class="secondary" id="connect">Connect</button>
  </div>
</header>

<section id="flowwrap" style="display:none">
<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="farr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink-soft)"/>
    </marker>
  </defs>

  <!-- caller -->
  <rect x="490" y="8" width="200" height="30" rx="15" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
  <text x="590" y="27" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)">Caller — web widget / phone</text>
  <path d="M590 38 v16" stroke="var(--ink-soft)" stroke-width="1.2" fill="none" marker-end="url(#farr)"/>

  <!-- transport -->
  <rect x="470" y="56" width="240" height="30" rx="8" fill="none" stroke="var(--border)"/>
  <text x="590" y="75" text-anchor="middle" font-size="10.5" fill="var(--ink)">Daily room / PSTN dial-in</text>

  <!-- call start: greeting lane (left) -->
  <rect x="60" y="56" width="330" height="106" rx="8" fill="none" stroke="var(--border)"/>
  <text x="74" y="75" font-size="11.5" font-weight="700" fill="var(--ink)">Call start — before the guest speaks</text>
  <g class="pnode" data-prompt="greetings">
    <rect x="74" y="84" width="150" height="20" rx="5" fill="none" stroke="var(--accent)" stroke-dasharray="4 3" stroke-width="1.4"/>
    <text x="82" y="98" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="var(--accent)">greetings.json</text>
  </g>
  <text x="232" y="98" font-size="9.5" fill="var(--ink-soft)">31 languages · instant</text>
  <text x="74" y="122" font-size="9.5" fill="var(--ink-soft)">time-neutral, or morning/afternoon/evening</text>
  <text x="74" y="136" font-size="9.5" fill="var(--ink-soft)">when the browser reports the guest's timezone</text>
  <text x="74" y="154" font-size="9.5" fill="var(--ink-soft)">spoken with NO LLM round-trip → straight to TTS</text>
  <path d="M390 110 H470 v-24" stroke="var(--ink-soft)" stroke-width="1.2" fill="none" marker-end="url(#farr)"/>

  <!-- guest speaks → STT -->
  <path d="M590 86 v22" stroke="var(--ink-soft)" stroke-width="1.2" fill="none" marker-end="url(#farr)"/>
  <text x="602" y="102" font-size="9.5" fill="var(--ink-soft)">guest speaks</text>
  <rect x="470" y="110" width="240" height="44" rx="8" fill="none" stroke="var(--border)"/>
  <text x="590" y="128" text-anchor="middle" font-size="10.5" fill="var(--ink)">STT — Gladia Solaria-1</text>
  <text x="590" y="144" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">detects the guest's language per utterance</text>

  <!-- filler branch (right) -->
  <path d="M710 132 H790 v18" stroke="var(--ink-soft)" stroke-width="1.2" fill="none" marker-end="url(#farr)"/>
  <rect x="730" y="152" width="330" height="84" rx="8" fill="none" stroke="var(--border)"/>
  <text x="744" y="171" font-size="11.5" font-weight="700" fill="var(--ink)">Instant acknowledgment — while the LLM thinks</text>
  <g class="pnode" data-prompt="fillers">
    <rect x="744" y="180" width="120" height="20" rx="5" fill="none" stroke="var(--ink-soft)" stroke-dasharray="4 3" stroke-width="1.4"/>
    <text x="752" y="194" font-size="9.5" font-family="ui-monospace,Menlo,monospace" fill="var(--ink-soft)">fillers.py</text>
  </g>
  <text x="872" y="194" font-size="9.5" fill="var(--ink-soft)">read-only · hardcoded · ~100ms</text>
  <text x="744" y="222" font-size="9.5" fill="var(--ink-soft)">"One moment." in the guest's detected language → TTS</text>

  <!-- LLM turn -->
  <path d="M590 154 v32" stroke="var(--ink-soft)" stroke-width="1.2" fill="none" marker-end="url(#farr)"/>
  <rect x="240" y="188" width="700" height="148" rx="8" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
  <text x="254" y="208" font-size="11.5" font-weight="700" fill="var(--ink)">LLM turn — Claude</text>

  <g class="pnode" data-prompt="system_prompt">
    <rect x="254" y="218" width="300" height="48" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    <text x="266" y="238" font-size="10.5" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="var(--accent)">system_prompt.md</text>
    <text x="266" y="255" font-size="9.5" fill="var(--ink-soft)">the "Her" persona · brevity · language rules</text>
  </g>
  <g class="pnode" data-prompt="actions_fragment">
    <rect x="574" y="218" width="220" height="48" rx="6" fill="none" stroke="var(--ink-soft)" stroke-dasharray="4 3" stroke-width="1.4"/>
    <text x="586" y="238" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="var(--ink-soft)">actions/prompt.py</text>
    <text x="586" y="255" font-size="9.5" fill="var(--ink-soft)">create_ticket flow · read-only, generated</text>
  </g>
  <rect x="814" y="218" width="112" height="48" rx="6" fill="none" stroke="var(--border)"/>
  <text x="870" y="238" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">hotel config</text>
  <text x="870" y="253" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">appended at boot</text>

  <rect x="254" y="282" width="672" height="40" rx="6" fill="none" stroke="var(--border)"/>
  <text x="266" y="299" font-size="9.5" fill="var(--ink-soft)">+ RAG retrieval (when enabled): destination/hotel knowledge injected into context per turn</text>
  <text x="266" y="314" font-size="9.5" fill="var(--ink-soft)">+ conversation memory (Redis): the full transcript so far</text>

  <!-- TTS / answer -->
  <path d="M590 336 v22" stroke="var(--ink-soft)" stroke-width="1.2" fill="none" marker-end="url(#farr)"/>
  <rect x="470" y="360" width="240" height="30" rx="8" fill="none" stroke="var(--border)"/>
  <text x="590" y="379" text-anchor="middle" font-size="10.5" fill="var(--ink)">TTS — guest's language</text>
  <path d="M590 390 v22" stroke="var(--ink-soft)" stroke-width="1.2" fill="none" marker-end="url(#farr)"/>
  <rect x="455" y="414" width="270" height="30" rx="15" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
  <text x="590" y="433" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">Caller hears the answer</text>

  <!-- reload annotation -->
  <text x="60" y="440" font-size="10" fill="var(--warn)">⚠ system_prompt.md and greetings.json are read ONCE at bot start —</text>
  <text x="60" y="456" font-size="10" fill="var(--warn)">edits apply from the NEXT CALL, never mid-call.</text>
</svg>
</section>
<div id="gate">Enter the admin token to load the prompts.</div>
<main id="main" style="display:none">
  <div id="list"></div>
  <div id="editor">
    <div id="ed-head"><div class="t" id="ed-title">—</div><div class="d" id="ed-desc"></div></div>
    <textarea id="ed-text" spellcheck="false"></textarea>
    <div id="ed-foot">
      <button id="save" disabled>Save</button>
      <button class="secondary" id="revert" disabled>Revert</button>
      <span id="status"></span>
      <span class="note" style="margin-left:auto">A timestamped backup of the previous version is kept in <code>logs/prompt_backups/</code> on every save.</span>
    </div>
  </div>
</main>
<script>
const STORAGE_TOKEN = "voxtera_admin_token";  // shared with the other admin pages
// admin/index.html stores the token in sessionStorage, admin.html in
// localStorage — accept either so arriving from the portal "just works".
let token = localStorage.getItem(STORAGE_TOKEN) || sessionStorage.getItem(STORAGE_TOKEN) || "";
let prompts = [];        // [{name,file,title,description,readonly,content,mtime}]
let current = null;      // selected prompt object
let savedContent = "";   // content as last loaded/saved (for dirty check)

const $ = id => document.getElementById(id);
$("token").value = token;

function setStatus(msg, cls){ const s=$("status"); s.textContent=msg||""; s.className=cls||""; }

async function api(method, body){
  const res = await fetch("/api/admin/voice-prompts", {
    method, headers: {"Content-Type":"application/json","X-Admin-Token":token},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error ? `${data.error}${data.detail? " — "+data.detail:""}` : `HTTP ${res.status}`);
  return data;
}

function renderList(){
  const list = $("list"); list.innerHTML = "";
  prompts.forEach(p => {
    const div = document.createElement("div");
    div.className = "item" + (current && current.name===p.name ? " active":"");
    const badge = p.readonly ? '<span class="badge">READ-ONLY</span>' : "";
    div.innerHTML = `<div class="t">${p.title}${badge}</div><div class="f">${p.file}</div><div class="d">${p.description}</div>`;
    div.onclick = () => select(p);
    list.appendChild(div);
  });
}

function select(p){
  if (current && !current.readonly && $("ed-text").value !== savedContent &&
      !confirm("You have unsaved changes — discard them?")) return;
  current = p; savedContent = p.content;
  $("ed-title").textContent = `${p.title}  ·  ${p.file}`;
  $("ed-desc").textContent = p.description;
  $("ed-text").value = p.content;
  $("ed-text").readOnly = !!p.readonly;
  $("save").disabled = true; $("revert").disabled = true;
  setStatus(p.readonly ? "read-only — shown for transparency, edit in code" : "loaded", "");
  renderList();
  highlightFlow();
}

// ── Flow diagram: click a prompt box to open it; highlight the selected one ──
function highlightFlow(){
  document.querySelectorAll("#flowwrap .pnode").forEach(n =>
    n.classList.toggle("sel", !!current && n.dataset.prompt === current.name));
}
function wireFlow(){
  document.querySelectorAll("#flowwrap .pnode").forEach(n => {
    n.onclick = () => {
      const p = prompts.find(x => x.name === n.dataset.prompt);
      if (p) select(p);
    };
  });
}
const FLOW_PREF = "voxtera_voice_prompt_flow_open";
function setFlowOpen(open){
  $("flowwrap").style.display = open ? "block" : "none";
  $("flow-toggle").textContent = open ? "Flow ▴" : "Flow ▾";
  localStorage.setItem(FLOW_PREF, open ? "1" : "0");
}
$("flow-toggle").onclick = () =>
  setFlowOpen($("flowwrap").style.display === "none");

$("ed-text").addEventListener("input", () => {
  if (current && current.readonly) return;
  const dirty = $("ed-text").value !== savedContent;
  $("save").disabled = !dirty; $("revert").disabled = !dirty;
  setStatus(dirty ? "unsaved changes" : "", dirty ? "dirty" : "");
});

$("revert").onclick = () => { $("ed-text").value = savedContent; $("ed-text").dispatchEvent(new Event("input")); };

$("save").onclick = async () => {
  if (!current || current.readonly) return;
  $("save").disabled = true; setStatus("saving…","");
  try {
    const content = $("ed-text").value;
    await api("POST", {name: current.name, content});
    current.content = content; savedContent = content;
    setStatus("saved — applies from the next call ✓","ok");
    $("revert").disabled = true;
  } catch (e) {
    setStatus("save failed: " + e.message, "err");
    $("save").disabled = false;
  }
};

async function load(){
  try {
    const data = await api("GET");
    prompts = data.prompts || [];
    $("gate").style.display="none"; $("main").style.display="grid";
    $("flow-toggle").style.display = "inline-block";
    setFlowOpen(localStorage.getItem(FLOW_PREF) !== "0");  // open by default
    wireFlow();
    renderList();
    if (prompts.length) select(prompts[0]);
  } catch (e) {
    $("gate").textContent = "Could not load prompts: " + e.message;
    $("gate").style.display="block"; $("main").style.display="none";
  }
}

$("connect").onclick = () => {
  token = $("token").value.trim();
  localStorage.setItem(STORAGE_TOKEN, token);
  load();
};
$("token").addEventListener("keydown", e => { if (e.key==="Enter") $("connect").click(); });

if (token) load();
</script>
</body>
</html>
