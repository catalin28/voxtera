<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxtera — Chat Logs</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f1117;
  color: #e4e4e7;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  background: #1a1b23;
  border-bottom: 1px solid #2a2b35;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
}
.header .badge {
  background: #3b82f6;
  color: #fff;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
}

/* Layout */
.container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left panel — session list */
.panel-left {
  width: 420px;
  min-width: 320px;
  border-right: 1px solid #2a2b35;
  display: flex;
  flex-direction: column;
  background: #13141b;
}

/* Filters */
.filters {
  padding: 12px 16px;
  border-bottom: 1px solid #2a2b35;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.filters label {
  font-size: 12px;
  color: #9ca3af;
}
.filters input[type="date"] {
  background: #1f2028;
  border: 1px solid #3a3b45;
  color: #e4e4e7;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 13px;
}
.filters button {
  background: #3b82f6;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
}
.filters button:hover { background: #2563eb; }
.filters .btn-clear {
  background: #374151;
}
.filters .btn-clear:hover { background: #4b5563; }

/* Session list */
.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.session-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 4px;
  border: 1px solid transparent;
  transition: background 0.15s;
}
.session-item:hover {
  background: #1f2028;
}
.session-item.active {
  background: #1e293b;
  border-color: #3b82f6;
}
.session-item .meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.session-item .date {
  font-size: 12px;
  color: #9ca3af;
}
.session-item .turns-badge {
  font-size: 11px;
  background: #374151;
  padding: 1px 7px;
  border-radius: 8px;
  color: #d1d5db;
}
.session-item .preview {
  font-size: 13px;
  color: #d1d5db;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-item .ip {
  font-size: 11px;
  color: #6b7280;
  margin-top: 2px;
}

.session-count {
  padding: 8px 16px;
  font-size: 12px;
  color: #6b7280;
  border-bottom: 1px solid #2a2b35;
}

/* Right panel — conversation view */
.panel-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.session-meta {
  padding: 14px 20px;
  background: #1a1b23;
  border-bottom: 1px solid #2a2b35;
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.session-meta .meta-item {
  font-size: 12px;
}
.session-meta .meta-label {
  color: #6b7280;
  margin-right: 4px;
}
.session-meta .meta-value {
  color: #e4e4e7;
  font-weight: 500;
}

.conversation {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  color: #6b7280;
  font-size: 15px;
}

/* Chat bubbles */
.turn {
  margin-bottom: 20px;
}
.turn .turn-meta {
  font-size: 11px;
  color: #6b7280;
  margin-bottom: 4px;
  padding-left: 4px;
}
.bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.bubble.user {
  background: #1e3a5f;
  color: #bfdbfe;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}
.bubble.bot {
  background: #1f2937;
  color: #e5e7eb;
  margin-right: auto;
  border-bottom-left-radius: 4px;
}
.turn-row {
  display: flex;
}
.turn-row.user-row {
  justify-content: flex-end;
}
.turn-row.bot-row {
  justify-content: flex-start;
}
.turn-timing {
  font-size: 11px;
  color: #4b5563;
  margin-top: 2px;
  padding-left: 4px;
}

/* Loading */
.loading {
  text-align: center;
  padding: 40px;
  color: #6b7280;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #4b5563; }
</style>
</head>
<body>

<div class="header">
  <h1>Chat Logs</h1>
  <span class="badge" id="total-badge">0 sessions</span>
</div>

<div class="container">
  <!-- Left: session list -->
  <div class="panel-left">
    <div class="filters">
      <label>From</label>
      <input type="date" id="date-from">
      <label>To</label>
      <input type="date" id="date-to">
      <button id="btn-filter">Filter</button>
      <button id="btn-clear" class="btn-clear">Clear</button>
    </div>
    <div class="session-count" id="session-count"></div>
    <div class="session-list" id="session-list">
      <div class="loading">Loading sessions…</div>
    </div>
  </div>

  <!-- Right: conversation detail -->
  <div class="panel-right">
    <div class="session-meta" id="session-meta" style="display:none;"></div>
    <div class="conversation" id="conversation">
      <div class="empty-state">Select a session to view the conversation</div>
    </div>
  </div>
</div>

<script>
const sessionList = document.getElementById('session-list');
const conversationEl = document.getElementById('conversation');
const sessionMetaEl = document.getElementById('session-meta');
const totalBadge = document.getElementById('total-badge');
const sessionCountEl = document.getElementById('session-count');
const dateFrom = document.getElementById('date-from');
const dateTo = document.getElementById('date-to');

// Default: today
const today = new Date().toISOString().slice(0, 10);
dateFrom.value = today;
dateTo.value = today;

let sessions = [];
let activeFilename = null;

async function loadSessions() {
  const params = new URLSearchParams();
  if (dateFrom.value) params.set('from', dateFrom.value);
  if (dateTo.value) params.set('to', dateTo.value);

  sessionList.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch('/api/audit/sessions?' + params.toString());
    sessions = await res.json();
  } catch (e) {
    sessionList.innerHTML = '<div class="loading">Error loading sessions</div>';
    return;
  }

  totalBadge.textContent = sessions.length + ' session' + (sessions.length !== 1 ? 's' : '');
  sessionCountEl.textContent = sessions.length + ' session' + (sessions.length !== 1 ? 's' : '') +
    (dateFrom.value ? ' from ' + dateFrom.value : '') +
    (dateTo.value ? ' to ' + dateTo.value : '');

  if (sessions.length === 0) {
    sessionList.innerHTML = '<div class="loading">No sessions found</div>';
    return;
  }

  sessionList.innerHTML = '';
  sessions.forEach(s => {
    const el = document.createElement('div');
    el.className = 'session-item' + (s.filename === activeFilename ? ' active' : '');
    el.innerHTML = `
      <div class="meta-row">
        <span class="date">${s.date} ${s.time}</span>
        <span class="turns-badge">${s.turns} turn${s.turns !== 1 ? 's' : ''}</span>
      </div>
      <div class="preview">${escHtml(s.first_query || '(empty)')}</div>
      <div class="ip">${s.client_ip}${s.channel ? ' · ' + s.channel : ''}${s.model ? ' · ' + s.model : ''}</div>
    `;
    el.addEventListener('click', () => loadSession(s.filename));
    sessionList.appendChild(el);
  });
}

async function loadSession(filename) {
  activeFilename = filename;
  // Highlight active
  document.querySelectorAll('.session-item').forEach((el, i) => {
    el.classList.toggle('active', sessions[i]?.filename === filename);
  });

  conversationEl.innerHTML = '<div class="loading">Loading conversation…</div>';
  sessionMetaEl.style.display = 'none';

  try {
    const res = await fetch('/api/audit/session/' + encodeURIComponent(filename));
    const turns = await res.json();
    renderConversation(turns);
  } catch (e) {
    conversationEl.innerHTML = '<div class="loading">Error loading session</div>';
  }
}

function renderConversation(turns) {
  if (!turns.length) {
    conversationEl.innerHTML = '<div class="empty-state">Empty session</div>';
    sessionMetaEl.style.display = 'none';
    return;
  }

  // Meta bar from first turn
  const first = turns[0];
  sessionMetaEl.style.display = 'flex';
  sessionMetaEl.innerHTML = `
    <div class="meta-item"><span class="meta-label">Session:</span><span class="meta-value">${first.session_id?.slice(0,12) || '?'}…</span></div>
    <div class="meta-item"><span class="meta-label">IP:</span><span class="meta-value">${first.client_ip || '?'}${first.forwarded_for ? ' (fwd: ' + first.forwarded_for + ')' : ''}</span></div>
    <div class="meta-item"><span class="meta-label">UA:</span><span class="meta-value">${(first.user_agent || '').slice(0, 60)}</span></div>
    <div class="meta-item"><span class="meta-label">Model:</span><span class="meta-value">${first.model || '?'}</span></div>
    <div class="meta-item"><span class="meta-label">Channel:</span><span class="meta-value">${first.channel || '?'}</span></div>
    <div class="meta-item"><span class="meta-label">Turns:</span><span class="meta-value">${turns.length}</span></div>
  `;

  conversationEl.innerHTML = '';
  turns.forEach(t => {
    const time = t.ts ? new Date(t.ts).toLocaleTimeString() : '';
    const llm = t.llm_ms ? `${Math.round(t.llm_ms)}ms` : '';
    const rag = t.rag_ms ? ` · RAG ${Math.round(t.rag_ms)}ms` : '';

    const turnEl = document.createElement('div');
    turnEl.className = 'turn';
    turnEl.innerHTML = `
      <div class="turn-meta">Turn ${t.turn_number || '?'} · ${time}</div>
      <div class="turn-row user-row">
        <div class="bubble user">${escHtml(t.user_query || '')}</div>
      </div>
      <div class="turn-row bot-row">
        <div class="bubble bot">${escHtml(t.bot_reply || '')}</div>
      </div>
      <div class="turn-timing">${llm}${rag}</div>
    `;
    conversationEl.appendChild(turnEl);
  });

  // Scroll to top
  conversationEl.scrollTop = 0;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Events
document.getElementById('btn-filter').addEventListener('click', loadSessions);
document.getElementById('btn-clear').addEventListener('click', () => {
  dateFrom.value = '';
  dateTo.value = '';
  loadSessions();
});

// Enter key on date inputs
dateFrom.addEventListener('keydown', e => { if (e.key === 'Enter') loadSessions(); });
dateTo.addEventListener('keydown', e => { if (e.key === 'Enter') loadSessions(); });

// Initial load
loadSessions();
</script>
</body>
</html>
