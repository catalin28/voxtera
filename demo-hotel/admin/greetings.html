<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxtera — Greetings Editor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f1117;
  color: #e4e4e7;
  min-height: 100vh;
}
header {
  background: #1a1b23;
  border-bottom: 1px solid #2a2b35;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 { font-size: 20px; font-weight: 600; color: #fff; }
header a {
  color: #9ca3af;
  text-decoration: none;
  font-size: 13px;
}
header a:hover { color: #e4e4e7; }

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 24px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.toolbar h2 {
  font-size: 18px;
  color: #fff;
}
.btn {
  background: #8b5cf6;
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.btn:hover { background: #7c3aed; }
.btn-danger { background: #dc2626; }
.btn-danger:hover { background: #b91c1c; }
.btn-secondary { background: #374151; }
.btn-secondary:hover { background: #4b5563; }

.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #065f46;
  color: #d1fae5;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  z-index: 1000;
}
.toast.error { background: #7f1d1d; color: #fecaca; }

table {
  width: 100%;
  border-collapse: collapse;
  background: #1a1b23;
  border: 1px solid #2a2b35;
  border-radius: 12px;
  overflow: hidden;
}
th, td {
  text-align: left;
  padding: 12px 16px;
  border-bottom: 1px solid #2a2b35;
}
th {
  background: #1f2029;
  color: #9ca3af;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
td { font-size: 13px; }
td.lang-code {
  font-weight: 600;
  color: #8b5cf6;
  width: 60px;
}
td.greeting-text {
  max-width: 500px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
td .actions {
  display: flex;
  gap: 8px;
}
tr:hover { background: #1f2029; }
tr:last-child td { border-bottom: none; }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #1a1b23;
  border: 1px solid #2a2b35;
  border-radius: 12px;
  padding: 32px;
  width: 600px;
  max-width: 90vw;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h3 {
  font-size: 18px;
  color: #fff;
  margin-bottom: 20px;
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.form-group input,
.form-group textarea {
  width: 100%;
  background: #0f1117;
  border: 1px solid #3a3b45;
  color: #e4e4e7;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}
.form-group textarea {
  resize: vertical;
  min-height: 80px;
}
.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #8b5cf6;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 24px;
}
.hint {
  font-size: 11px;
  color: #6b7280;
  margin-top: 4px;
}
</style>
</head>
<body>

<header>
  <h1>👋 Greetings Editor</h1>
  <a href="/admin/index.html">← Back to Admin</a>
</header>

<div class="container">
  <div class="toolbar">
    <h2>Multilingual Welcome Messages</h2>
    <button class="btn" id="btn-add">+ Add Language</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Lang</th>
        <th>Neutral Greeting</th>
        <th>Timed</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="greetings-body">
      <tr><td colspan="4" style="text-align:center;color:#6b7280;">Loading…</td></tr>
    </tbody>
  </table>
</div>

<!-- Edit/Add Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Edit Greeting</h3>
    <div class="form-group">
      <label>Language Code</label>
      <input type="text" id="inp-lang" placeholder="e.g. en, fr, ro" maxlength="5" />
      <p class="hint">ISO 639-1 two-letter code (e.g. en, fr, es, ro, tr)</p>
    </div>
    <div class="form-group">
      <label>Neutral Greeting</label>
      <textarea id="inp-greeting" placeholder="Time-neutral greeting text…"></textarea>
      <p class="hint">Used when guest's timezone is unknown (PSTN, Telegram, older widget).</p>
    </div>
    <div class="form-group">
      <label>Morning Greeting</label>
      <textarea id="inp-morning" placeholder="Morning variant (optional)…"></textarea>
    </div>
    <div class="form-group">
      <label>Afternoon Greeting</label>
      <textarea id="inp-afternoon" placeholder="Afternoon variant (optional)…"></textarea>
    </div>
    <div class="form-group">
      <label>Evening Greeting</label>
      <textarea id="inp-evening" placeholder="Evening variant (optional)…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btn-cancel">Cancel</button>
      <button class="btn" id="btn-save">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN = sessionStorage.getItem('voxtera_admin_token');
if (!TOKEN) {
  window.location.href = '/admin/index.html';
}

const tbody = document.getElementById('greetings-body');
const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const inpLang = document.getElementById('inp-lang');
const inpGreeting = document.getElementById('inp-greeting');
const inpMorning = document.getElementById('inp-morning');
const inpAfternoon = document.getElementById('inp-afternoon');
const inpEvening = document.getElementById('inp-evening');
const toast = document.getElementById('toast');

let editingLang = null; // null = adding new, string = editing existing

// --- API helpers ---
async function apiGet() {
  const res = await fetch('/api/admin/greetings', {
    headers: { 'X-Admin-Token': TOKEN }
  });
  if (!res.ok) throw new Error(`${res.status}`);
  return res.json();
}

async function apiSave(lang, greeting, timed) {
  const body = { lang, greeting };
  if (timed) body.timed = timed;
  const res = await fetch('/api/admin/greetings', {
    method: 'POST',
    headers: { 'X-Admin-Token': TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || `${res.status}`);
  }
  return res.json();
}

async function apiDelete(lang) {
  const res = await fetch(`/api/admin/greetings/${lang}`, {
    method: 'DELETE',
    headers: { 'X-Admin-Token': TOKEN }
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || `${res.status}`);
  }
  return res.json();
}

// --- Toast ---
function showToast(msg, isError = false) {
  toast.textContent = msg;
  toast.className = 'toast' + (isError ? ' error' : '');
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

// --- Render table ---
async function loadGreetings() {
  try {
    const data = await apiGet();
    renderTable(data);
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="4" style="color:#ef4444;">Failed to load: ${e.message}</td></tr>`;
  }
}

function renderTable(data) {
  const greetings = data.greetings || {};
  const timed = data.timed_greetings || {};
  const langs = Object.keys(greetings).sort();

  if (langs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="color:#6b7280;">No greetings configured.</td></tr>';
    return;
  }

  tbody.innerHTML = langs.map(lang => {
    const hasTimed = !!timed[lang];
    const text = greetings[lang] || '';
    const truncated = text.length > 80 ? text.slice(0, 80) + '…' : text;
    return `<tr>
      <td class="lang-code">${lang}</td>
      <td class="greeting-text" title="${text.replace(/"/g, '&quot;')}">${truncated}</td>
      <td>${hasTimed ? '✅' : '—'}</td>
      <td class="actions">
        <button class="btn btn-secondary" onclick="editGreeting('${lang}')">Edit</button>
        ${lang !== 'en' ? `<button class="btn btn-danger" onclick="deleteGreeting('${lang}')">Delete</button>` : ''}
      </td>
    </tr>`;
  }).join('');
}

// --- Modal ---
function openModal(lang = null, data = null) {
  editingLang = lang;
  modalTitle.textContent = lang ? `Edit: ${lang}` : 'Add New Language';
  inpLang.value = lang || '';
  inpLang.disabled = !!lang;
  inpGreeting.value = '';
  inpMorning.value = '';
  inpAfternoon.value = '';
  inpEvening.value = '';

  if (data) {
    inpGreeting.value = data.greeting || '';
    if (data.timed) {
      inpMorning.value = data.timed.morning || '';
      inpAfternoon.value = data.timed.afternoon || '';
      inpEvening.value = data.timed.evening || '';
    }
  }
  modalOverlay.classList.add('active');
  (lang ? inpGreeting : inpLang).focus();
}

function closeModal() {
  modalOverlay.classList.remove('active');
  editingLang = null;
}

// --- Actions ---
let _cachedData = null;

async function editGreeting(lang) {
  try {
    const data = await apiGet();
    _cachedData = data;
    const greeting = data.greetings[lang] || '';
    const timed = data.timed_greetings ? data.timed_greetings[lang] : null;
    openModal(lang, { greeting, timed });
  } catch (e) {
    showToast('Failed to load: ' + e.message, true);
  }
}

async function deleteGreeting(lang) {
  if (!confirm(`Delete all greetings for "${lang}"? This cannot be undone.`)) return;
  try {
    await apiDelete(lang);
    showToast(`Deleted "${lang}" greetings`);
    loadGreetings();
  } catch (e) {
    showToast(e.message, true);
  }
}

async function saveGreeting() {
  const lang = inpLang.value.trim().toLowerCase();
  const greeting = inpGreeting.value.trim();
  if (!lang || !greeting) {
    showToast('Language code and neutral greeting are required.', true);
    return;
  }

  const morning = inpMorning.value.trim();
  const afternoon = inpAfternoon.value.trim();
  const evening = inpEvening.value.trim();
  let timed = null;
  if (morning || afternoon || evening) {
    timed = {
      morning: morning || greeting,
      afternoon: afternoon || greeting,
      evening: evening || greeting
    };
  }

  try {
    await apiSave(lang, greeting, timed);
    showToast(`Saved "${lang}" greeting`);
    closeModal();
    loadGreetings();
  } catch (e) {
    showToast(e.message, true);
  }
}

// --- Events ---
document.getElementById('btn-add').addEventListener('click', () => openModal());
document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('btn-save').addEventListener('click', saveGreeting);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// --- Init ---
loadGreetings();
</script>
</body>
</html>
