[project]
name = "voxtera"
version = "0.1.0"
description = "Multilingual real-time voice agent for the tourism industry"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Voxtera Team" },
]
dependencies = [
    "pipecat-ai[anthropic,openai,deepgram,silero,local,daily]>=0.0.85",
    "loguru>=0.7.2",
    "openai>=1.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.7",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "sentence-transformers>=3.0",
    "pyrnnoise>=0.4.3",
]

[project.urls]
Homepage = "https://github.com/pokemonnode34-byte/voxtera"
Repository = "https://github.com/pokemonnode34-byte/voxtera"
Issues = "https://github.com/pokemonnode34-byte/voxtera/issues"

[project.scripts]
voxtera = "voxtera.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxtera"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["voxtera"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
