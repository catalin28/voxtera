# Per-category staff directory for the demo hotel.
# Loaded by `voxtera.actions.staff.StaffDirectory.for_hotel("demo")`.
#
# Each top-level key is a Category value (must match the values in
# `voxtera.actions.ticket.Category`). The list is staff available for
# that category. Order matters — it's the order they appear in the
# Telegram inline keyboard when "Find available technician" is tapped.
#
# Fields:
#   name      — display name shown on the button and in the ticket history
#   role      — short label, used for log lines
#   eta_min   — typical response time in minutes; shown on the button
#   skills    — optional list of tags. Future: filter by issue keywords
#               (e.g. "hot water" → filter for plumbing skill).
#
# To enable a new category for a hotel, add a key here AND add the
# Category to `allowed_categories` in `config/hotels/<hotel_id>.yaml`.

