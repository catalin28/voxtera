# Demo hotel config for Voxtera.
# Loaded by `voxtera.actions.hotel_config.load_hotel_config("demo")`.
# Matches the rag content in `demo-hotel/`.

hotel_name: "Grand Hôtel Lumière"

# Optional fully custom spoken greeting (opening line of every call). When
# omitted, the bot uses the generic "You've reached the concierge at
# {hotel_name}" template. Keep this in English on the phone path — the
# caller's language isn't known until they speak.
greeting: "Good day, and welcome to the Grand Hôtel Lumière. You've reached our concierge — how may I assist you today?"

# Staff operate in English. The bot still speaks to guests in their detected
# language, but ticket summaries land in the channel translated to English.
official_language: "en"

# IANA timezone of the property. Anchors booking date resolution ("table for
# two tomorrow at 7pm") to the hotel's local clock. Omit only for local dev.
timezone: "Europe/Paris"

# `Voxtera Demo Tickets` channel. Bot must be admin with Post messages perm.
# See docs/ACTIONS_FEATURE_PLAN.md Phase 1 for setup.
telegram_channel_id: "-1003718824790"

# Subset of categories this hotel accepts. The LLM tool will only choose
# from this list. Trim if a hotel doesn't want a category (e.g. small
# boutique hotels often won't have a separate Concierge desk).
allowed_categories:
  - Maintenance
  - Reservation
  - Concierge
  - Restaurant
  - Housekeeping
  - Lost & Found
  - Complaint
  - Emergency
  - Feedback
  - Other

# Hotel-specific facts the LLM should know. Used in Phase 3 when we update
# the system prompt. Keep it short — every token costs latency.
system_prompt_addendum: |
  You are deployed at the Grand Hôtel Lumière, a 5-star property in Paris's
  8th arrondissement near the Champs-Élysées. House amenities include
  Diptyque bath products, Nespresso machines, rainfall showers in Deluxe
  rooms and above, and a Hypnos mattress in every room. You can converse
  with guests in any language they speak — Romanian, Turkish, Hindi, etc.
  Front-desk staff speaks English and French, so file all staff-facing
  tickets in English regardless of the guest's language.

  MENU ITEMS — SPEECH RECOGNITION NOTE:
  The hotel menu contains French dish names. Because the guest speaks over
  a voice channel, speech-to-text may garble foreign words. If a guest's
  words sound approximately like any of the following dishes, assume they
  mean that dish and respond about it:
  - "coq au vin" (may be heard as "cock of an", "coke a van", "cook oh van")
  - "bouillabaisse" (may be heard as "boo ya base", "bull ya base")
  - "magret de canard" (may be heard as "magra de kanar", "magret duck")
  - "risotto aux truffes noires" (may be heard as "risotto trough noir")
  - "tarte fine aux pommes" (may be heard as "tart fin oh pom")
  - "brioche perdue" (may be heard as "brioche per due")
  - "omelette au comté" (may be heard as "omelette au county", "omelet comtay")
  - "croque monsieur" (may be heard as "crock monsieur", "croak mister")
  - "Menu Découverte" (may be heard as "menu day covert", "menu decouvert")
  When in doubt, ask "Do you mean [correct dish name]?" rather than guessing
  wrongly or saying you don't understand.
