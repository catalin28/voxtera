name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio dependencies
        # pipecat-ai[local] -> pyaudio needs portaudio.h to build from source.
        # Locally you get this via `brew install portaudio` (macOS) or
        # `apt install portaudio19-dev` (Ubuntu). CI runs on Ubuntu.
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Type-check with mypy
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest -v
